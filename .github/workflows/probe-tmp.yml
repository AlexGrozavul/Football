name: probe-tmp
on:
  pull_request:
    paths: [".github/workflows/probe-tmp.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: EC bulletin xlsx, attempt 2
        run: |
          pip install -q openpyxl
          curl -sSL -m 90 -A "Mozilla/5.0 (football-planner research)" -o page.html "https://energy.ec.europa.eu/data-and-analysis/weekly-oil-bulletin_en"
          python3 - <<'PY'
          import re, html, urllib.parse, subprocess
          t = open('page.html', encoding='utf-8').read()
          for m in re.finditer(r'href="(/document/download/[^"]*prices[^"]*)"', t, re.I):
              print('LINK', html.unescape(m.group(1)))
          m = re.search(r'href="(/document/download/[^"]*Weekly(?:%20|\+| )Oil(?:%20|\+| )Bulletin(?:%20|\+| )Weekly(?:%20|\+| )prices(?:%20|\+| )with(?:%20|\+| )Taxes[^"]*\.xlsx)"', t, re.I)
          print('MATCH', m and m.group(1))
          url = 'https://energy.ec.europa.eu' + html.unescape(m.group(1))
          subprocess.run(['curl','-sSL','-m','90','-o','w.xlsx','-w','%{http_code} %{content_type} %{size_download}\n',url], check=True)
          import openpyxl
          wb = openpyxl.load_workbook('w.xlsx', data_only=True)
          for ws in wb:
              print('SHEET', ws.title, ws.max_row, ws.max_column)
              for row in ws.iter_rows(min_row=1, max_row=6, values_only=True):
                  print(row[:14])
          ws = wb.worksheets[0]
          for row in ws.iter_rows(values_only=True):
              if row and any(isinstance(c, str) and c.strip() in ('DE','RO','DE ','RO ','Germany','Romania') for c in row[:3]):
                  print('ROW', row[:14])
          PY
