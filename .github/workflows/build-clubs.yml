name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.parse,urllib.robotparser,sys
          from html.parser import HTMLParser
          UA="FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          IDS="Q13426883,Q136089,Q1378922,Q1387417,Q1514109,Q1565781,Q15849956,Q16743331,Q17321080,Q175616,Q176168,Q176850,Q2207914,Q2208389,Q2521441,Q479306,Q479340,Q493464,Q535785,Q537301,Q566141,Q566165,Q566172,Q566183,Q639419,Q639472,Q639506,Q639525,Q666000,Q666024,Q666067,Q692704,Q692755,Q720528,Q797022,Q821096,Q831887,Q831892".split(",")
          last={}
          TITLES={}
          TSV=[]
          def get(url,tries=4):
              host=urllib.parse.urlparse(url).netloc
              for i in range(tries):
                  w=1-(time.time()-last.get(host,0))
                  if w>0: time.sleep(w)
                  last[host]=time.time()
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":UA}),timeout=30)
                      b=r.read(3000000)
                      ct=r.headers.get_content_charset() or "utf-8"
                      return r.status,b.decode(ct,"replace"),r.geturl()
                  except urllib.error.HTTPError as e:
                      if e.code==429:
                          time.sleep(min(int(e.headers.get("Retry-After","10") or 10),60)+1); continue
                      return e.code,"",url
                  except Exception as e:
                      if i==tries-1: return -1,str(e)[:80],url
                      time.sleep(2)
              return 429,"",url
          # Wikidata P856
          sites={}
          for k in range(0,len(IDS),25):
              q="https://www.wikidata.org/w/api.php?"+urllib.parse.urlencode(dict(action="wbgetentities",ids="|".join(IDS[k:k+25]),props="claims|labels",languages="de|en",format="json",maxlag="5"))
              for attempt in range(5):
                  st,body,_=get(q)
                  if st==200 and "entities" in json.loads(body): break
                  print("WIKIDATA retry",attempt,st,body[:160]); time.sleep(25)
              if st!=200 or "entities" not in json.loads(body): print("WIKIDATA FAIL"); sys.exit(1)
              for qid,e in json.loads(body)["entities"].items():
                  lab=(e.get("labels",{}).get("de") or e.get("labels",{}).get("en") or {}).get("value","?")
                  u=[c["mainsnak"]["datavalue"]["value"] for c in e.get("claims",{}).get("P856",[]) if c.get("rank")!="deprecated" and c["mainsnak"].get("datavalue")]
                  sites[qid]=(lab,u)
          print("SUMMARY clubs",len(IDS),"with P856",sum(1 for v in sites.values() if v[1]))
          class P(HTMLParser):
              def __init__(s):
                  super().__init__(); s.skip=0; s.t=[]; s.links=[]; s.href=None; s.lt=[]; s.title=''; s.intitle=False
              def handle_starttag(s,tag,a):
                  if tag=="title": s.intitle=True
                  if tag in("script","style","noscript"): s.skip+=1
                  if tag=="a":
                      s.href=dict(a).get("href"); s.lt=[]
              def handle_endtag(s,tag):
                  if tag=="title": s.intitle=False
                  if tag in("script","style","noscript"): s.skip=max(0,s.skip-1)
                  if tag=="a" and s.href:
                      s.links.append((s.href," ".join(s.lt))); s.href=None
              def handle_data(s,d):
                  if s.intitle: s.title+=d
                  if s.skip: return
                  d=d.strip()
                  if d:
                      s.t.append(d)
                      if s.href is not None: s.lt.append(d)
          KW=["chronik","geschichte","historie","tradition","derby","rivale","verein","über uns","ueber-uns","ueber uns","ueber_uns","ueberuns","ueber-den-verein"]
          PAT=re.compile(r"Rivale|Rivalit|Erzrivale|Derby|Lokalrivale|Erzfeind|Feindschaft",re.I)
          def page(url):
              st,html,fu=get(url)
              if st!=200: return st,None,[]
              p=P(); p.feed(html)
              TITLES[url]=" ".join(p.title.split())
              return st," ".join(p.t),p.links
          opened=0;nosite=[];nofetch=[]
          for qid in IDS:
              lab,us=sites.get(qid,("?",[]))
              if not us:
                  nosite.append(lab); continue
              site=us[0]
              pr=urllib.parse.urlparse(site); base=f"{pr.scheme}://{pr.netloc}"
              rp=urllib.robotparser.RobotFileParser()
              st,rb,_=get(base+"/robots.txt")
              if st in(401,403,429) or st==-1:
                  print(f"== {lab} {qid} {site}: robots.txt status {st}: STOP"); nofetch.append((lab,f"robots {st}")); continue
              rp.parse(rb.splitlines() if st==200 else [])
              if not rp.can_fetch(UA,site) and not rp.can_fetch("*",site):
                  print(f"== {lab} {qid} {site}: home disallowed by robots"); nofetch.append((lab,"robots disallow")); continue
              st,txt,links=page(site)
              if txt is None:
                  print(f"== {lab} {qid} {site}: home status {st}"); nofetch.append((lab,f"home {st}")); continue
              opened+=1
              print(f"== {lab} {qid} {site}")
              cands=[];seen=set()
              for h,t in links:
                  if not h or h.startswith(("mailto:","tel:","javascript:","#")): continue
                  u=urllib.parse.urljoin(site,h).split("#")[0]
                  hp=urllib.parse.urlparse(u)
                  if hp.netloc.replace("www.","")!=pr.netloc.replace("www.",""): continue
                  s=(h+" "+t).lower()
                  pri=[i for i,k in enumerate(KW) if k in s]
                  if pri and u not in seen and u!=site:
                      seen.add(u); cands.append((min(pri),u))
              cands.sort(key=lambda x:x[0]); cands=[u for _,u in cands][:6]
              pages=[(site,txt)]
              for u in cands:
                  if not (rp.can_fetch(UA,u) or rp.can_fetch("*",u)):
                      print("  skip(robots)",u); continue
                  st,t2,_=page(u)
                  if t2 is None: print("  fail",st,u); continue
                  opened+=1; pages.append((u,t2))
              for u,t in pages:
                  hits=list(PAT.finditer(t)); print("  PAGE",u,len(t),"hits",len(hits))
                  TSV.append(qid+"\t"+lab+"\t"+u+"\t"+TITLES.get(u,"")+"\t"+str(len(hits)))
          print("SUMMARY opened pages",opened,"no site:",nosite)
          print("SUMMARY not fetched:",nofetch)
          open("probe-out.tsv","w",encoding="utf-8").write("\n".join(TSV)+"\n")
          PY
      - name: Commit output to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out.tsv
          git commit -m "probe output"
          git push
