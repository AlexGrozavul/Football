name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only probe (temporary)
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.parse, urllib.error
          UA = "FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          last = {}
          def get(url, data=None, wiki=False):
              host = urllib.parse.urlparse(url).netloc
              for t in range(4):
                  w = 1 - (time.time() - last.get(host, 0))
                  if w > 0: time.sleep(w)
                  last[host] = time.time()
                  req = urllib.request.Request(url, data=data, headers={"User-Agent": UA})
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")[:200]
                      if e.code == 429:
                          time.sleep(int(e.headers.get("Retry-After", "10")) + 1); continue
                      if e.code in (502, 503, 504) and t < 3:
                          time.sleep(20); continue
                      return e.code, body
                  except Exception as e:
                      if t == 3: return 0, str(e)[:200]
                      time.sleep(10)
              return 0, "gave up"
          out = []
          def P(*a): out.append(" ".join(str(x) for x in a)); print(*a, flush=True)
          P("PROBE START")
          def robots(host):
              c, b = get("https://%s/robots.txt" % host)
              P("robots", host, c, "| bytes", len(b), "|", re.sub(r"\s+", " ", b[:200]))
              return c, b
          def allowed(b, path):
              ua = False; dis = []
              for ln in b.splitlines():
                  l = ln.strip()
                  if l.lower().startswith("user-agent:"): ua = l.split(":", 1)[1].strip() == "*"
                  elif ua and l.lower().startswith("disallow:"):
                      d = l.split(":", 1)[1].strip()
                      if d and path.startswith(d): return False
              return True
          for host, url in (
              ("www.espn.com", "https://www.espn.com/soccer/match/_/gameId/750491"),
              ("www.espn.com", "https://global.espn.com/football/match/_/gameId/750527/tondela-casa-pia"),
              ("prod.beinsports.com", "https://prod.beinsports.com/en-us/soccer/articles/live-casa-pia-vs-benfica-the-eagles-look-to-bounce-back-in-liga-portugal-on-bein-sports-2026-08-17")):
              h = host
              if "global.espn" in url: h = "global.espn.com"
              rc, rb = robots(h)
              path = urllib.parse.urlparse(url).path
              if rc in (200, 404) and (rc == 404 or allowed(rb, path)):
                  c, b = get(url)
                  bot = bool(re.search(r"captcha|are you a robot|access denied|challenge", b[:3000], re.I)) if c == 200 else False
                  P("PAGE", url, c, len(b), "botchallenge?", bot)
                  if c == 200 and not bot:
                      t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", b, flags=re.S)
                      t = re.sub(r"<[^>]+>", " ", t); t = re.sub(r"\s+", " ", t)
                      for m in list(re.finditer(r"Rio Maior|Pina Manique|Venue|Estádio|Estadio|Stadium", t))[:6]:
                          P("  HIT", t[max(0, m.start() - 100): m.start() + 160])
                      for m in list(re.finditer(r"Casa Pia", t))[:2]:
                          P("  TITLE", t[max(0, m.start() - 60): m.start() + 140])
                  elif c != 200: P("  body", re.sub(r"\s+", " ", b[:150]))
              else:
                  P("  robots disallow or error: not fetched", url)
          P("PROBE END")
          PY
