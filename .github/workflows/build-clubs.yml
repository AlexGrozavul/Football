name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit one of the two hand-written files that
# decide what is on the map: data/league-tiers.csv, which says which
# leagues count, and data/clubs-manual.csv, which corrects, adds and
# removes individual clubs. clubs-manual.csv was missing from this list
# until 2026-09-19, so a hand correction sat inert until the Sunday cron
# or a manual run - the CS Dinamo Bucuresti correction was committed on
# 2026-09-18 and was still not on the map a day later.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    # TEMPORARY: disabled while the fcbayern probe runs, so that asking a
    # question does not also rebuild and commit the club layer.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/country-review.csv ]; then
              echo
              echo "### Clubs that may be in the wrong country's file"
              echo
              echo "Reported, never removed. A club listed here is still on the map."
              echo
              echo '```'
              cat data/clubs/country-review.csv
              echo '```'
            fi
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  # TEMPORARY PROBE - remove together with tools/_probe_fcbayern.py.
  # The sandbox answers 403 to CONNECT for fcbayern.com; a runner does not.
  fcbayern-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read FC Bayern's own ticket pages
        timeout-minutes: 8
        run: |
          set -o pipefail
          python3 tools/_probe_fcbayern.py 2>&1 | tee /tmp/fcb.log

      - name: Write the probe to the run summary
        if: always()
        run: |
          {
            echo '## FC Bayern ticket pages (temporary probe)'
            echo
            echo '```'
            cat /tmp/fcb.log 2>/dev/null || echo 'probe did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
