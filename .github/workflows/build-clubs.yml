name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  # TEMPORARY, removed in this branch once the probe has been read:
  # if: false so that dispatching this workflow to ask a question does
  # not also rebuild and commit the club layer as a side effect.
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  # TEMPORARY, removed in this branch once its answer has been read.
  # tools/diagnose_p118_rank.py asks Wikidata which clubs the club
  # query's truthy P118 join hides. The sandbox this was written in
  # answers 403 to CONNECT for wikidata.org, so a runner is the only
  # route to the answer.
  p118-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Which clubs does wdt:P118 hide
        run: |
          set -o pipefail
          python3 tools/diagnose_p118_rank.py | tee /tmp/p118.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## P118 rank diagnostic"
            echo
            echo '```'
            cat /tmp/p118.log 2>/dev/null || echo "the probe did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
