name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, time, json, re
          UA = "FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          def get(url, data=None):
              for i in range(4):
                  time.sleep(1)
                  try:
                      req = urllib.request.Request(url, data=data, headers={"User-Agent": UA})
                      return urllib.request.urlopen(req, timeout=120).read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      print("HTTP", e.code, url[:80])
                      if e.code in (429, 503):
                          time.sleep(int(e.headers.get("Retry-After", "30")))
                          continue
                      return None
                  except Exception as e:
                      print("ERR", e)
              return None
          r = get("https://stadiumdb.com/robots.txt")
          print("stadiumdb robots:", r)
          if r and "Disallow: /stadiums" not in r:
              h = get("https://stadiumdb.com/stadiums/por")
              if h:
                  rows = re.findall(r"<tr.*?</tr>", h, re.S)
                  for row in rows:
                      txt = re.sub(r"<[^>]+>", " ", row)
                      txt = re.sub(r"\s+", " ", txt)
                      if re.search(r"Casa Pia|Rio Maior|Pina Manique", txt):
                          print("STADIUMDB ROW:", txt)
                  print("stadiumdb por rows:", len(rows))
          q = "[out:json][timeout:60];(relation(13900988);way(around:300,39.344553,-8.935249)[leisure=stadium];);out tags;"
          o = get("https://overpass-api.de/api/interpreter", urllib.parse.urlencode({"data": q}).encode())
          if o:
              for e in json.loads(o).get("elements", []):
                  print("OSM", e["type"], e["id"], e.get("tags"))
          w = get("https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q2990539&props=claims|labels&format=json&maxlag=5")
          if w:
              c = json.loads(w)["entities"]["Q2990539"]["claims"]
              print("WD label", json.loads(w)["entities"]["Q2990539"]["labels"].get("en"))
              for pid in ("P1083", "P625", "P137", "P466", "P31"):
                  for s in c.get(pid, []):
                      print("WD", pid, s["mainsnak"].get("datavalue", {}).get("value"), "refs:", len(s.get("references", [])))
          PY

  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
