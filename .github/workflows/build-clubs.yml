name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only probe (temporary)
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, urllib.parse, urllib.error
          UA = "FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          last = {}
          def get(url, data=None, wiki=False):
              host = urllib.parse.urlparse(url).netloc
              for t in range(4):
                  w = 1 - (time.time() - last.get(host, 0))
                  if w > 0: time.sleep(w)
                  last[host] = time.time()
                  req = urllib.request.Request(url, data=data, headers={"User-Agent": UA})
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")[:200]
                      if e.code == 429:
                          time.sleep(int(e.headers.get("Retry-After", "10")) + 1); continue
                      if e.code in (502, 503, 504) and t < 3:
                          time.sleep(20); continue
                      return e.code, body
                  except Exception as e:
                      if t == 3: return 0, str(e)[:200]
                      time.sleep(10)
              return 0, "gave up"
          out = []
          def P(*a): out.append(" ".join(str(x) for x in a)); print(*a, flush=True)
          P("PROBE START")
          def robots(host):
              c, b = get("https://%s/robots.txt" % host)
              P("robots", host, c, "| bytes", len(b), "|", re.sub(r"\s+", " ", b[:160]))
              return c
          # --- Overpass
          if robots("overpass-api.de") in (200, 404):
              def ov(q, label):
                  c, b = get("https://overpass-api.de/api/interpreter", data=urllib.parse.urlencode({"data": q}).encode())
                  if c != 200: P("OVERPASS", label, "HTTP", c, b[:100]); return
                  for e in json.loads(b)["elements"]:
                      ct = e.get("center") or e
                      tg = e.get("tags", {})
                      P("OSM", label, e["type"] + "/" + str(e["id"]), "%.6f %.6f" % (ct.get("lat", 0), ct.get("lon", 0)), "|", tg.get("name"), "|", tg.get("leisure"), tg.get("sport"), tg.get("capacity"))
                  P("OSM", label, "n=", len(json.loads(b)["elements"]))
              ov('[out:json][timeout:60];(way(870819809);way(305202095););out tags center;', "lusit-two-ways")
              ov('[out:json][timeout:60];nwr["name"~"Lourosa|Lusit"]["leisure"~"stadium|pitch|sports_centre"](around:1500,40.9879,-8.5436);out tags center;', "lusit-around")
              ov('[out:json][timeout:60];nwr["name"~"Rio Maior"]["leisure"~"stadium|pitch|sports_centre"](around:3000,39.3444,-8.9353);out tags center;', "riomaior-around")
              ov('[out:json][timeout:60];nwr["leisure"~"stadium|pitch"]["sport"~"soccer|football"](around:600,39.3444,-8.9353);out tags center;', "riomaior-soccer600")
          # --- Wikidata (Wikimedia: maxlag)
          def wd(params):
              q = urllib.parse.urlencode(dict(params, format="json", maxlag="5"))
              return get("https://www.wikidata.org/w/api.php?" + q)
          for term in ("Estádio Municipal de Rio Maior", "Estádio do Lusitânia de Lourosa"):
              c, b = wd({"action": "wbsearchentities", "search": term, "language": "pt", "limit": "5"})
              P("WD search", term, c, b[:60] if c != 200 else [(x["id"], x.get("label"), x.get("description")) for x in json.loads(b).get("search", [])])
              if c == 200:
                  ids = [x["id"] for x in json.loads(b).get("search", [])][:3]
                  if ids:
                      c2, b2 = wd({"action": "wbgetentities", "ids": "|".join(ids), "props": "claims|labels", "languages": "en|pt"})
                      if c2 == 200:
                          for i, e in json.loads(b2)["entities"].items():
                              cl = e.get("claims", {})
                              g = lambda p: [x.get("mainsnak", {}).get("datavalue", {}).get("value") for x in cl.get(p, [])]
                              P("WD item", i, e.get("labels", {}).get("pt", e.get("labels", {}).get("en", {})).get("value"), "P625", g("P625"), "P1083", g("P1083"), "P31", [v.get("id") for v in g("P31") if v])
          # --- StadiumDB
          if robots("stadiumdb.com") in (200, 404):
              c, b = get("https://stadiumdb.com/stadiums/por")
              P("STADIUMDB por", c, len(b))
              for ln in re.split(r"</tr>", b):
                  t = re.sub(r"<[^>]+>", " ", ln); t = re.sub(r"\s+", " ", t)
                  if re.search(r"Rio Maior|Casa Pia|Lourosa|Lusit|Pina Manique", t): P("STADIUMDB row", t[:200])
          # --- Club site and league
          for host, url in (("casapiaac.pt", "https://casapiaac.pt/"), ("www.ligaportugal.pt", "https://www.ligaportugal.pt/en/")):
              rc = robots(host)
              if rc in (200, 404):
                  c, b = get(url)
                  hits = [re.sub(r"\s+", " ", b[max(0, m.start() - 80): m.start() + 120]) for m in re.finditer(r"Rio Maior", b)][:4]
                  P("SITE", url, c, len(b), "hits", len(hits)); [P("  HIT", h) for h in hits]
          P("PROBE END")
          PY
