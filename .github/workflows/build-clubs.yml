name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Probe
        run: |
          cd /tmp/pw
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { execSync } from 'child_process';
          const UA = 'FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)';
          const urls = process.env.LIST.split(/\s+/).filter(Boolean);
          const robots = {};
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function rules(host) {
            if (robots[host]) return robots[host];
            let dis = [], st = 0;
            try {
              const r = await fetch('https://' + host + '/robots.txt', { headers: { 'User-Agent': UA }, redirect: 'follow' });
              st = r.status; const t = await r.text(); if (st >= 400 && st !== 404) dis = ['/'];
              let on = false;
              for (const l of t.split('\n')) {
                const [k, ...v] = l.split(':'); const val = v.join(':').trim(); const key = k.trim().toLowerCase();
                if (key === 'user-agent') on = (val === '*' || /footballplanner/i.test(val));
                else if (on && key === 'disallow' && val) dis.push(val);
              }
              console.log('ROBOTS', host, st, 'disallow:', JSON.stringify(dis).slice(0, 600));
            } catch (e) {
                console.log('ROBOTS', host, 'fetch ERR', e.message, (e.cause && e.cause.code) || '');
                try { const out = execSync(`curl -sS -m 20 -A "${UA}" -o /dev/null -w "%{http_code} %{http_version}" https://${host}/robots.txt 2>&1`).toString(); console.log('ROBOTS-CURL', host, out); }
                catch (e2) { console.log('ROBOTS-CURL', host, 'ERR', String(e2.stdout || e2.message).slice(0, 300)); }
                console.log('-> robots unreadable: STOP host', host); dis = ['/'];
              }
            await sleep(1000);
            return robots[host] = dis;
          }
          const allowed = (u, dis) => { const p = new URL(u).pathname + new URL(u).search;
            return !dis.some(d => { const re = new RegExp('^' + d.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*')); return re.test(p); }); };
          const b = await chromium.launch();
          const ctx = await b.newContext({ userAgent: UA, locale: 'de-DE' });
          for (const u of urls) {
            const host = new URL(u).host; const dis = await rules(host);
            if (!allowed(u, dis)) { console.log('SKIP-ROBOTS', u); continue; }
            const pg = await ctx.newPage();
            try {
              const r = await pg.goto(u, { waitUntil: 'networkidle', timeout: 45000 });
              const st = r ? r.status() : 0;
              console.log('=== PAGE', u, 'status', st, 'server', r ? r.headers()['server'] : '');
              if (st >= 400) { console.log('STOP status', st); continue; }
              const frag = decodeURIComponent(new URL(u).hash.slice(1));
              const faq = frag.startsWith('faq') ? (frag.split('=')[1] || 'FAQs zu Tickets') : '';
              const gre = frag.startsWith('grep=') ? new RegExp(frag.slice(5), 'i') : null;
              let txt = (await pg.evaluate((faq) => { const el = document.querySelector('main, article, .entry-content, #content') || document.body; if (!faq) return el.innerText; const t = el.textContent; const i = t.indexOf(faq); return t.slice(i < 0 ? 0 : i); }, faq)).replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n');
              if (gre) txt = txt.split('\n').filter(l => gre.test(l)).slice(0, 40).join('\n');
              console.log(txt.slice(0, faq ? 14000 : (+process.env.MAX || 7000)));
              const links = await pg.evaluate(() => [...document.querySelectorAll('a[href]')].map(a => a.href + ' | ' + a.innerText.trim().slice(0, 40)));
              const want = links.filter(l => !/#/.test(l.split(' | ')[0]) && !/main-navigation/.test(l) && /ticket|zweitmarkt|clubsale|club-sale|agb|bedingung|pdf/i.test(l));
              console.log('LINKS', [...new Set(want)].slice(0, 40).join('\n'));
            } catch (e) { console.log('=== PAGE', u, 'ERR', e.message); }
            await pg.close(); await sleep(1000);
          }
          await b.close();
          EOF
          LIST="$(cat <<'L'
          https://www.ticket-onlineshop.com/ols/sv07elversberg/de
          https://sv07elversberg.de/die-sve/mitgliedschaft/#faq=FAQs%20zur%20Mitgliedschaft
          https://stadiumdb.com/news/2026/07/germany_elversberg_prepares_its_modest_stadium_for_the_bundesliga
          https://de.wikipedia.org/wiki/Ursapharm-Arena_an_der_Kaiserlinde#grep=Plätze|Kapazität|Zuschauer|Sitzpl|Stehpl
          https://www.wochenblatt-reporter.de/saarland/c-sport/sv-elversberg-startet-verlaengerung-der-dauerkarten_a796809
          https://www.wochenblatt-reporter.de/saarland/c-sport/sv-elversberg-meldet-abschluss-des-dauerkarten-verkaufs_a818018
          L
          )" MAX=7000 node probe.mjs
