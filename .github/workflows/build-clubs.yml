name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit one of the two hand-written files that
# decide what is on the map: data/league-tiers.csv, which says which
# leagues count, and data/clubs-manual.csv, which corrects, adds and
# removes individual clubs. clubs-manual.csv was missing from this list
# until 2026-09-19, so a hand correction sat inert until the Sunday cron
# or a manual run - the CS Dinamo Bucuresti correction was committed on
# 2026-09-18 and was still not on the map a day later.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  # TEMPORARY: docs.stadiamaps.com and stadiamaps.com are blocked from the
  # sandbox proxy the same way Wikidata was. This job reads Stadia Maps'
  # tile-URL and attribution docs from a GitHub runner, which has normal
  # egress. Remove this job and the `if: false` below once done.
  docs-check-tmp:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Stadia Maps docs
        run: |
          set -o pipefail
          curl -sS -A "Mozilla/5.0" https://docs.stadiamaps.com/tutorials/raster-maps-with-leaflet/ -o /tmp/leaflet.html
          curl -sS -A "Mozilla/5.0" https://docs.stadiamaps.com/map-styles/alidade-smooth-dark/ -o /tmp/style.html
          curl -sS -A "Mozilla/5.0" https://docs.stadiamaps.com/raster/ -o /tmp/raster.html
          curl -sS -A "Mozilla/5.0" https://docs.stadiamaps.com/attribution/ -o /tmp/attribution.html
          python3 -c "
          import re, html
          for f in ['/tmp/leaflet.html', '/tmp/style.html', '/tmp/raster.html', '/tmp/attribution.html']:
              print('=====', f, '=====')
              t = open(f, encoding='utf-8', errors='replace').read()
              t = re.sub(r'<script.*?</script>', ' ', t, flags=re.S)
              t = re.sub(r'<style.*?</style>', ' ', t, flags=re.S)
              text = re.sub(r'<[^>]+>', ' ', t)
              text = html.unescape(text)
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n', text)
              print(text[:8000])
          "

  clubs:
    if: false  # TEMPORARY, see docs-check-tmp above
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/country-review.csv ]; then
              echo
              echo "### Clubs that may be in the wrong country's file"
              echo
              echo "Reported, never removed. A club listed here is still on the map."
              echo
              echo '```'
              cat data/clubs/country-review.csv
              echo '```'
            fi
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
