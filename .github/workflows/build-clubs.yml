name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.parse,urllib.robotparser,sys
          from html.parser import HTMLParser
          UA="FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          IDS="Q13426883,Q136089,Q1378922,Q1387417,Q1514109,Q1565781,Q15849956,Q16743331,Q17321080,Q175616,Q176168,Q176850,Q2207914,Q2208389,Q2521441,Q479306,Q479340,Q493464,Q535785,Q537301,Q566141,Q566165,Q566172,Q566183,Q639419,Q639472,Q639506,Q639525,Q666000,Q666024,Q666067,Q692704,Q692755,Q720528,Q797022,Q821096,Q831887,Q831892".split(",")
          last={}
          def get(url,tries=4):
              host=urllib.parse.urlparse(url).netloc
              for i in range(tries):
                  w=1-(time.time()-last.get(host,0))
                  if w>0: time.sleep(w)
                  last[host]=time.time()
                  try:
                      r=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":UA}),timeout=30)
                      b=r.read(3000000)
                      ct=r.headers.get_content_charset() or "utf-8"
                      return r.status,b.decode(ct,"replace"),r.geturl()
                  except urllib.error.HTTPError as e:
                      if e.code==429:
                          time.sleep(min(int(e.headers.get("Retry-After","10") or 10),60)+1); continue
                      return e.code,"",url
                  except Exception as e:
                      if i==tries-1: return -1,str(e)[:80],url
                      time.sleep(2)
              return 429,"",url
          class P(HTMLParser):
              def __init__(s):
                  super().__init__(); s.skip=0; s.t=[]; s.title=""; s.intitle=False
              def handle_starttag(s,tag,a):
                  if tag in("script","style","noscript"): s.skip+=1
                  if tag=="title": s.intitle=True
              def handle_endtag(s,tag):
                  if tag in("script","style","noscript"): s.skip=max(0,s.skip-1)
                  if tag=="title": s.intitle=False
              def handle_data(s,d):
                  if s.intitle: s.title+=d
                  if s.skip: return
                  d=d.strip()
                  if d: s.t.append(d)
          PAT=re.compile(r"Rivale|Rivalit|Erzrivale|Derby|Lokalrivale|Erzfeind|Feindschaft|Nachbar",re.I)
          URLS=[
           ("http://www.tsg-neustrelitz.de/chronik",["Zum Auswärtsspiel beim Erzrivalen FC Neubrandenburg begleiten mehr als 1.500 Neustrelitzer","Im letzten Spiel muss man beim Erzrivalen FC Tollense Neubrandenburg unbedingt gewinnen"]),
           ("https://www.schwaebische.de/regional/oberschwaben/ravensburg/der-ligaalltag-heisst-sc-pfullendorf-694454",[]),
           ("https://www.schwaebische.de/regional/oberschwaben/ravensburg/pfullendorfer-talfahrt-gewinnt-an-rasanz-746141",[]),
           ("https://www.diefalsche9.de/?p=68225",[]),
          ]
          robots={}
          for url,quotes in URLS:
              pr=urllib.parse.urlparse(url); base=f"{pr.scheme}://{pr.netloc}"
              if base not in robots:
                  st,rb,_=get(base+"/robots.txt")
                  rp=urllib.robotparser.RobotFileParser()
                  if st in(401,403,429) or st==-1:
                      robots[base]=None; print("ROBOTS STOP",base,st)
                  else:
                      rp.parse(rb.splitlines() if st==200 else []); robots[base]=rp
              rp=robots[base]
              if rp is None: continue
              if not (rp.can_fetch(UA,url) or rp.can_fetch("*",url)):
                  print("DISALLOWED",url); continue
              st,html,fu=get(url)
              if st!=200: print("FAIL",st,url); continue
              p=P(); p.feed(html); t=" ".join(p.t)
              print("== PAGE",url,"title:",p.title.strip()[:120],"len",len(t))
              for q in quotes: print("   QUOTE",q in t,"|",q)
              last_end=-1;n=0
              for m in PAT.finditer(t):
                  if m.start()<last_end: continue
                  a=max(0,m.start()-300);b=min(len(t),m.end()+300);last_end=b;n+=1
                  if n>10: break
                  print("    >>",t[a:b])
          print("SUMMARY done")
          PY
