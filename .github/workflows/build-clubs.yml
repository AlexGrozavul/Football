name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv or
# data/clubs-manual.csv, the two files that decide which clubs appear on
# the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "data/clubs-manual.csv"
      - "data/roster-links-manual.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Probe
        run: |
          set -o pipefail
          cat > /tmp/probe.py <<'PROBE_EOF'
          import csv,json,glob,os,re,sys,time,unicodedata,urllib.request,urllib.parse,urllib.error,html
          from html.parser import HTMLParser
          UA="FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)"
          _last=[0.0]
          NREQ=[0]
          SPECIAL=str.maketrans({'ß':'ss','ø':'o','đ':'d','ł':'l','æ':'ae','œ':'oe','ı':'i','þ':'th','ð':'d'})
          def fold(s):
              s=unicodedata.normalize('NFKD',s.lower().translate(SPECIAL))
              s=''.join(c for c in s if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          def words(s): return set(fold(s).split())
          def http(url,tries=5):
              """one request per second; 429 -> Retry-After (else 60 s), up to 4 retries"""
              retries=0
              while True:
                  w=1.0-(time.time()-_last[0])
                  if w>0: time.sleep(w)
                  _last[0]=time.time(); NREQ[0]+=1
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Encoding':'identity'})
                      with urllib.request.urlopen(req,timeout=90) as r:
                          return r.read().decode('utf-8','replace'),r.headers
                  except urllib.error.HTTPError as e:
                      if e.code in (429,503) and retries<4:
                          ra=e.headers.get('Retry-After'); wait=int(ra) if ra and ra.isdigit() else 60
                          retries+=1; time.sleep(wait); continue
                      raise
          def api(host,**p):
              p.update(format='json',formatversion='2',maxlag='5')
              url=f'https://{host}/w/api.php?'+urllib.parse.urlencode(p)
              retries=0
              while True:
                  body,h=http(url)
                  d=json.loads(body)
                  if 'error' in d and d['error'].get('code')=='maxlag' and retries<4:
                      retries+=1; ra=h.get('Retry-After'); time.sleep(int(ra) if ra and ra.isdigit() else 5); continue
                  if 'error' in d: raise RuntimeError(str(d['error'])[:200])
                  return d
          def load_map():
              m={}
              for f in sorted(glob.glob('data/clubs/??.json')):
                  d=json.load(open(f))
                  for c in d['clubs']:
                      m[c['id']]={'name':c.get('name') or '','country':d['country'],'tier':c.get('tier')}
              return m
          def rows(path): return list(csv.DictReader(open(path,encoding='utf-8')))
          def title_of(url):
              u=urllib.parse.urlparse(url)
              t=urllib.parse.unquote(u.path.split('/wiki/',1)[1]) if '/wiki/' in u.path else ''
              return t.replace('_',' '),urllib.parse.unquote(u.fragment)
          def wiki_host(url):
              h=urllib.parse.urlparse(url).netloc
              m=re.match(r'^([a-z\-]+)(\.m)?\.wikipedia\.org$',h)
              return f'{m.group(1)}.wikipedia.org' if m else None

          MAP=load_map()
          SRC={r['sourceId']:r for r in rows('data/club-culture-sources.csv')}
          FR=rows('data/club-friendships.csv'); RV=rows('data/club-rivalries.csv')
          def pairkey(a,b): return frozenset((a,b))
          FR_PAIRS={pairkey(r['clubQ'],r['friendQ']):r['status'] for r in FR if r['friendQ']}
          RV_PAIRS={pairkey(r['clubQ'],r['rivalQ']) for r in RV if r['rivalQ']}
          FR_ACTIVE={k for k,v in FR_PAIRS.items() if v!='ended'}

          class Anch(HTMLParser):
              def __init__(s):
                  super().__init__(convert_charrefs=True); s.t=[]; s.n=0; s.skip=0; s.stack=[]; s.cur=None; s.an=[]
              def add(s,x):
                  s.t.append(x); s.n+=len(x)
              VOID={'br','img','hr','meta','link','input','wbr','col'}
              def handle_starttag(s,tag,a):
                  a=dict(a); cls=a.get('class','') or ''
                  skip=tag in('style','script') or (tag=='sup' and 'reference' in cls) or 'mw-editsection' in cls
                  if tag not in s.VOID:
                      s.stack.append((tag,skip))
                      if skip: s.skip+=1
                  if skip: return
                  if tag in('p','li','div','br','tr','h1','h2','h3','h4','h5','h6','td','th','dd','dt','ul','ol','table','caption'): s.add('\n')
                  if tag=='a' and not s.skip:
                      h=a.get('href','') or ''
                      if h.startswith('/wiki/') and 'new' not in cls.split() and not re.match(r'/wiki/(File|Datei|Category|Kategorie|Special|Spezial|Help|Wikipedia|Hilfe|Portal|Template|Vorlage|Fichier|Cat%C3%A9gorie|Sp%C3%A9cial|Image|Fi%C3%A8chier|Wikip%C3%A9dia|Ajutor|Fi%C8%99ier|Categorie):',h,re.I):
                          s.cur=(s.n,urllib.parse.unquote(h[6:].split('#')[0]).replace('_',' '))
              def handle_endtag(s,tag):
                  for i in range(len(s.stack)-1,-1,-1):
                      if s.stack[i][0]==tag:
                          for t,sk in s.stack[i:]:
                              if sk: s.skip-=1
                          del s.stack[i:]
                          break
                  if tag=='a' and s.cur:
                      s.an.append((s.cur[0],s.n,s.cur[1])); s.cur=None
              def handle_data(s,d):
                  if s.skip: return
                  d=re.sub(r'[ \t\r\n]+',' ',d)
                  if s.t and s.t[-1].endswith((' ','\n')) and d.startswith(' '): d=d[1:]
                  s.add(d)
              def result(s): return ''.join(s.t),s.an

          PAGES={}   # (host,title) -> dict
          def page(host,title):
              k=(host,title)
              if k in PAGES: return PAGES[k]
              P={'links':[],'ok':False}
              try:
                  cont={}
                  while True:
                      d=api(host,action='query',prop='links',titles=title,pllimit='max',plnamespace='0',redirects='1',**cont)
                      for pg in d['query']['pages']:
                          P['links']+= [l['title'] for l in pg.get('links',[])]
                          P['title']=pg.get('title')
                      if 'continue' in d: cont=d['continue']
                      else: break
                  d=api(host,action='parse',page=title,prop='text',redirects='1')
                  a=Anch(); a.feed(d['parse']['text']); P['text'],P['anch']=a.result()
                  P['ok']=True
              except Exception as e:
                  P['err']=str(e)[:150]
              PAGES[k]=P; return P

          QCACHE={}
          def resolve(host,titles):
              need=[t for t in dict.fromkeys(titles) if (host,t) not in QCACHE]
              for i in range(0,len(need),50):
                  ch=need[i:i+50]
                  d=api(host,action='query',prop='pageprops',ppprop='wikibase_item',redirects='1',titles='|'.join(ch))
                  q=d['query']; nm={x['from']:x['to'] for x in q.get('normalized',[])}; rd={x['from']:x['to'] for x in q.get('redirects',[])}
                  item={p['title']:p.get('pageprops',{}).get('wikibase_item') for p in q['pages'] if not p.get('missing')}
                  for t in ch:
                      n=nm.get(t,t); n=rd.get(n,n); QCACHE[(host,t)]=item.get(n)
              return {t:QCACHE[(host,t)] for t in titles}

          BOUND=re.compile(r'(?<=[a-zäöüßéèàç\)\]»"”])[.!?]\s+(?=[A-ZÄÖÜÉÈ„"»\(])|\n')
          def sentence_span(text,i,j):
              s=0
              for m in BOUND.finditer(text,0,i):
                  s=m.end()
              m=BOUND.search(text,j); e=m.start()+1 if m else len(text)
              return s,e
          def find_quote(text,q):
              q1=re.sub(r'\s+',' ',q).strip()
              i=text.find(q1)
              if i<0:
                  i=text.lower().find(q1.lower())
              if i<0:
                  ws=q1.split(); 
                  for n in (10,7,5):
                      if len(ws)>=n:
                          p=' '.join(ws[:n]); i=text.lower().find(p.lower())
                          if i>=0: return i,min(len(text),i+len(q1))
                  return None
              return i,i+len(q1)

          def name_ok(rowname,mapname):
              a,b=words(rowname),words(mapname)
              return bool(a) and bool(b) and (a<=b or b<=a)

          WD={}
          def wd_info(qids):
              need=[q for q in qids if q not in WD]
              for i in range(0,len(need),50):
                  ch=need[i:i+50]
                  d=api('www.wikidata.org',action='wbgetentities',ids='|'.join(ch),props='labels|claims',languages='en')
                  for q,e in d['entities'].items():
                      def cl(p): 
                          out=[]
                          for c in e.get('claims',{}).get(p,[]):
                              v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
                              if isinstance(v,dict) and 'id' in v: out.append(v['id'])
                          return out
                      WD[q]={'label':e.get('labels',{}).get('en',{}).get('value',q),'p17':cl('P17'),'p831':cl('P831')}
              cs={c for q in qids if q in WD for c in WD[q]['p17']}
              needc=[c for c in cs if c not in WD]
              for i in range(0,len(needc),50):
                  d=api('www.wikidata.org',action='wbgetentities',ids='|'.join(needc[i:i+50]),props='labels',languages='en')
                  for q,e in d['entities'].items(): WD[q]={'label':e.get('labels',{}).get('en',{}).get('value',q),'p17':[],'p831':[]}

          def sig_word(name):
              ws=[w for w in fold(re.sub(r'\(.*?\)','',name)).split() if len(w)>=4]
              return max(ws,key=len) if ws else None

          OUT=[]; SUMM={}
          def decide(kind,row):
              cq=row['clubQ']; name=row['friendName'] if kind=='F' else row['rivalName']
              src=SRC[row['sourceId']]; host=wiki_host(src['url']); title,_=title_of(src['url'])
              tag=f"{kind}|{cq}|{name}|{row['sourceId']}"
              if not host: return tag,'SKIP','not a wikipedia source'
              P=page(host,title)
              if not P['ok']: return tag,'SKIP','page '+P.get('err','?')
              # titles: links + anchors
              anch_titles=[t for _,_,t in P['anch']]
              allt=list(dict.fromkeys(P['links']+anch_titles))
              Q=resolve(host,allt)
              linkq={t:Q[t] for t in P['links'] if Q.get(t)}
              # sentence
              sent=None; sq=[]
              text=P['text']
              if kind=='F':
                  r=find_quote(text,row['quote'])
              else:
                  m=re.search(re.escape(name),text,re.I)
                  if not m and sig_word(name):
                      m=re.search(re.escape(sig_word(name)),text,re.I)
                  r=(m.start(),m.end()) if m else None
              if r:
                  s,e=sentence_span(text,r[0],r[1]); sent=text[s:e]
                  for a0,a1,t in P['anch']:
                      if a0>=s and a1<=e+1 and Q.get(t) in MAP and Q[t]!=cq: sq.append(Q[t])
                  sq=list(dict.fromkeys(sq))
              # route 1
              r1=sorted({q for t,q in linkq.items() if q in MAP and q!=cq and name_ok(name,MAP[q]['name'])})
              note=''
              if len(r1)>1: return tag,'AMBIG',','.join(f"{q}({MAP[q]['name']})" for q in r1)
              chosen=None; route=None
              if len(r1)==1: chosen=r1[0]; route='R1'
              elif len(sq)==1 and sent is not None: chosen=sq[0]; route='R2'
              elif len(sq)>1: note=' sentence has >1 map clubs: '+','.join(sq)
              if chosen:
                  pk=pairkey(cq,chosen)
                  if kind=='F' and pk in RV_PAIRS: return tag,'CONFLICT',f'{chosen}({MAP[chosen]["name"]}) pair is in rivalries'
                  if kind=='R' and pk in FR_ACTIVE: return tag,'CONFLICT',f'{chosen}({MAP[chosen]["name"]}) pair is a non-ended friendship'
                  ins='inSent' if (sent is not None and chosen in sq) else 'notInSent'
                  extra=f" sent=«{sent[:150]}»" if route=='R2' else ''
                  return tag,'FILL',f'{route} {chosen} ({MAP[chosen]["name"]},{MAP[chosen]["country"]}) {ins}{extra}'
              # not filled: report map-name matches and off-map candidates
              mn=[f"{q}({v['name']})" for q,v in MAP.items() if q!=cq and name_ok(name,v['name'])][:4]
              sw=sig_word(name); cand=[]
              for t,q in linkq.items():
                  if q in MAP: continue
                  if sw and sw in fold(t): cand.append(q)
              for a0,a1,t in P['anch']:
                  pass
              # sentence anchors off map
              if sent is not None:
                  s,e=sentence_span(text,r[0],r[1])
                  for a0,a1,t in P['anch']:
                      if a0>=s and a1<=e+1 and Q.get(t) and Q[t] not in MAP and Q[t]!=cq and Q[t] not in cand: cand.append(Q[t])
              cand=list(dict.fromkeys(cand))[:4]
              wd_info(cand)
              cd=[f"{q}:{WD[q]['label']}[{','.join(WD[c]['label'] for c in WD[q]['p17'][:2])}]{('P831='+','.join(WD[q]['p831'])) if WD[q]['p831'] else ''}" for q in cand if q in WD]
              return tag,'LEFT',f"{note} sent={'Y' if sent else 'N'} mapNameMatch={mn} cand={cd}"

          def main():
              todo=[('F',r) for r in FR if not r['friendQ']]+[('R',r) for r in RV if not r['rivalQ']]
              res=[]
              for k,r in todo:
                  try: res.append(decide(k,r))
                  except Exception as e: res.append((f"{k}|{r['clubQ']}|{r.get('friendName') or r.get('rivalName')}|{r['sourceId']}",'ERROR',str(e)[:150]))
              from collections import Counter
              c=Counter(x[1] for x in res)
              summ=f"SUMMARY A: blank={len(todo)} "+' '.join(f'{k}={v}' for k,v in sorted(c.items()))+f" requests={NREQ[0]}"
              print(summ)
              for t,s,d in res: print(f"{s:8s} {t} :: {d}")
              print(summ)
          main()

          PROBE_EOF
          python3 -u /tmp/probe.py 2>&1 | tee /tmp/probe.log
