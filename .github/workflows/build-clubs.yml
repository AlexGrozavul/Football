name: Build club layer

# Fetches clubs from Wikidata for the configured countries and commits
# data/clubs/. Weekly, because clubs move division once a season, not
# once a day.
#
# Also runs whenever you edit data/league-tiers.csv, which is the file
# that decides which clubs appear on the map at all.

on:
  schedule:
    # 04:23 UTC every Sunday.
    - cron: "23 4 * * 0"
  push:
    branches: [main]
    paths:
      - "data/league-tiers.csv"
      - "tools/fetch_clubs.py"
      - ".github/workflows/build-clubs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clubs
  cancel-in-progress: false

jobs:
  # TEMPORARY job. This sandbox answers 403 to CONNECT for stadiumdb.com,
  # en.wikipedia.org and wikidata.org, so the only way to run the two new
  # checks is from a runner. Both this job and the `if: false` on `clubs`
  # below are removed in this same branch once the review files are in -
  # see the Actions-dispatch entry in CLAUDE.md. The two checks have
  # their own workflows (crosscheck-stadiumdb.yml, check-rosters.yml),
  # but a workflow_dispatch only works for a file that already exists on
  # the DEFAULT branch, which theirs do not yet.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Probe the ranks and the unmapped leagues
        run: |
          set -o pipefail
          python3 tools/_probe.py

      - name: Rebuild the club layer with this branch's hand corrections
        run: |
          set -o pipefail
          python3 tools/fetch_clubs.py 2>&1 | tee /tmp/clubs.log

      - name: StadiumDB cross-check
        run: |
          set -o pipefail
          python3 tools/crosscheck_stadiumdb.py 2>&1 | tee /tmp/stadiumdb.log

      - name: Roster check
        run: |
          set -o pipefail
          python3 tools/check_rosters.py 2>&1 | tee /tmp/rosters.log

      - name: Commit the review files
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clubs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi
          git commit -m "chore: rebuild the club layer and rerun both checks"
          git push || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }

  clubs:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch clubs from Wikidata
        run: |
          python3 tools/fetch_clubs.py | tee /tmp/clubs.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Club layer"
            echo
            echo '```'
            cat /tmp/clubs.log 2>/dev/null || echo "fetch did not run"
            echo '```'
            if [ -f data/clubs/unmapped-leagues.csv ]; then
              echo
              echo "<details><summary>Unmapped leagues — paste the ones you want into data/league-tiers.csv</summary>"
              echo
              echo '```'
              head -n 60 data/clubs/unmapped-leagues.csv
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d data/clubs ]; then
            git add data/clubs/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild club layer ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
