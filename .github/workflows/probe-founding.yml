name: probe-founding
# Temporary probe for founding data batch 4; removed before the data commit.
on:
  pull_request:
    paths: ['.github/workflows/probe-founding.yml']
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN: "1"
      URLS: |
        https://www.fc-saarbruecken.de/ terms
        https://www.sgf1903.de/ terms
        https://www.fcingolstadt.de/ terms
        https://www.ssv-jahn.de/ terms
        https://www.viktoria1904.de/ terms
        https://www.fortuna-koeln.de/ terms
        https://www.sv98.de/ terms
        https://www.wuerzburger-kickers.de/ terms
        https://www.dfb.de/ terms
        https://datencenter.dfb.de/ terms
        wd:Q157463
        wd:Q153539
        wd:Q170117
        wd:Q265570
        wd:Q695008
        wd:Q310608
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils >/dev/null
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/probe.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'); const { execSync } = require('child_process');
          const UA = 'FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)';
          const CLAUDE = /claudebot|anthropic-ai|claude-web|claude-user|claude-searchbot/i;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const robots = {};
          let n = 0;
          async function post(body) {
            if (body.length > 59000) body = body.slice(0, 59000) + '\n[cut at 59000]';
            const r = await fetch(`https://api.github.com/repos/${process.env.REPO}/issues/${process.env.PR}/comments`, {
              method: 'POST', headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
              body: JSON.stringify({ body }) });
            console.log('posted', r.status, body.length);
            await sleep(1500);
          }
          function parseRobots(txt) {
            const groups = []; let cur = null, lastUA = false;
            for (let line of txt.split(/\r?\n/)) {
              line = line.replace(/#.*/, '').trim(); if (!line) continue;
              const m = line.match(/^([A-Za-z-]+)\s*:\s*(.*)$/); if (!m) continue;
              const k = m[1].toLowerCase(), v = m[2].trim();
              if (k === 'user-agent') { if (!lastUA) { cur = { ua: [], rules: [] }; groups.push(cur); } cur.ua.push(v.toLowerCase()); lastUA = true; }
              else { lastUA = false; if (cur && (k === 'allow' || k === 'disallow')) cur.rules.push([k, v]); }
            }
            return groups;
          }
          function allowed(groups, path) {
            let g = groups.filter(g => g.ua.some(u => u.includes('footballplannerbot')));
            if (!g.length) g = groups.filter(g => g.ua.includes('*'));
            let best = null;
            for (const gr of g) for (const [k, v] of gr.rules) {
              if (!v) continue;
              const re = new RegExp('^' + v.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\\\$$/, '$'));
              if (re.test(path) && (!best || v.length > best[1].length || (v.length === best[1].length && k === 'allow'))) best = [k, v];
            }
            return !best || best[0] === 'allow' ? [true, best] : [false, best];
          }
          async function getRobots(ctx, origin) {
            if (origin in robots) return robots[origin];
            let res = { ok: true, note: '', groups: [] };
            try {
              const r = await ctx.request.get(origin + '/robots.txt', { timeout: 30000 });
              const t = await r.text(); await sleep(1000);
              res.note = `robots.txt HTTP ${r.status()}`;
              if (r.status() === 200) {
                res.groups = parseRobots(t);
                const cl = t.split(/\n/).filter(l => CLAUDE.test(l));
                if (cl.length) { res.ok = false; res.note += ' NAMES ANTHROPIC/CLAUDE CRAWLER: ' + cl.join(' / '); }
                const rel = t.split(/\n/).filter(l => /user-agent|disallow|allow/i.test(l)).slice(0, 60).join('\n');
                res.text = rel;
              } else if ([403, 429, 503].includes(r.status())) { res.ok = false; res.note += ' (stop)'; }
            } catch (e) { res.ok = false; res.note = 'robots.txt failed: ' + e.message.slice(0, 120); }
            robots[origin] = res;
            await post(`### run ${process.env.RUN} robots ${origin}\n${res.note}\n\`\`\`\n${(res.text || '').slice(0, 6000)}\n\`\`\``);
            return res;
          }
          const KEY = /gegr[üu]nd|gr[üu]ndung|founded|fondé|fondation|ultra|fanclub|fan-club|fanszene|fangruppe|supporters|impressum|nutzungsbeding|urheber|copyright|vervielf|kopier|crawler|automatisiert|\b(1[89]\d\d|20[0-2]\d)\b/i;
          async function visit(ctx, url, flags) {
            n++;
            const u = new URL(url);
            const rb = await getRobots(ctx, u.origin);
            if (!rb.ok) { await post(`### run ${process.env.RUN} #${n} ${url}\nNOT OPENED: ${rb.note}`); return []; }
            const [ok, rule] = allowed(rb.groups, u.pathname + u.search);
            if (!ok) { await post(`### run ${process.env.RUN} #${n} ${url}\nNOT OPENED: robots ${rule[0]} ${rule[1]}`); return []; }
            let head = `### run ${process.env.RUN} #${n} ${url}\n`, text = '', links = [];
            try {
              if (/\.pdf($|\?)/i.test(url)) {
                const r = await ctx.request.get(url, { timeout: 60000 });
                head += `HTTP ${r.status()} ${r.headers()['content-type']}\n`;
                fs.writeFileSync('/tmp/x.pdf', await r.body());
                text = execSync('pdftotext -layout /tmp/x.pdf -').toString();
              } else {
                const page = await ctx.newPage();
                const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(3500);
                const ct = resp ? resp.headers()['content-type'] || '' : '';
                head += `HTTP ${resp ? resp.status() : '?'} | final ${page.url()} | title: ${await page.title()} | ${ct}\n`;
                if (/pdf/.test(ct)) { fs.writeFileSync('/tmp/x.pdf', await resp.body()); text = execSync('pdftotext -layout /tmp/x.pdf -').toString(); }
                else {
                  await page.evaluate(() => document.querySelectorAll('[id*=cookie i],[class*=cookie i],[id*=consent i],[class*=consent i],#usercentrics-root,#onetrust-banner-sdk').forEach(e => e.remove())).catch(() => {});
                  text = await page.evaluate(() => document.body ? document.body.innerText : '');
                  links = await page.evaluate(() => [...document.querySelectorAll('a[href]')].map(a => [a.innerText.trim().replace(/\s+/g, ' ').slice(0, 80), a.href]));
                }
                await page.close();
              }
            } catch (e) { head += 'ERROR ' + e.message.slice(0, 200) + '\n'; }
            await sleep(1000);
            const seen = new Set(); links = links.filter(([t, h]) => !h.startsWith('javascript') && !seen.has(h) && seen.add(h));
            const isWiki = /wikipedia\.org/.test(u.host);
            let shown = links;
            if (isWiki) shown = links.filter(([t, h]) => !/wikipedia\.org|wikimedia|wikidata|mediawiki/.test(h));
            text = text.replace(/\n{3,}/g, '\n\n');
            let body = text;
            if (text.length > 20000) {
              const paras = text.split(/\n+/).filter(p => KEY.test(p));
              body = text.slice(0, 3000) + `\n[... page ${text.length} chars; paragraphs with a date or keyword follow]\n` + paras.join('\n');
            }
            const linkTxt = shown.map(([t, h]) => `${t} | ${h}`).join('\n');
            let out = head + `text ${text.length} chars, ${links.length} links${isWiki ? ' (external only listed)' : ''}\n\`\`\`text\n${body}\n\`\`\`\n`;
            const lk = `LINKS\n\`\`\`\n${linkTxt}\n\`\`\``;
            if (out.length + lk.length < 59000) await post(out + lk);
            else { await post(out); await post(head + lk); }
            return links;
          }
          (async () => {
            const browser = await chromium.launch();
            const ctx = await browser.newContext({ userAgent: UA, locale: 'de-DE' });
            for (const line of process.env.URLS.split('\n').map(s => s.trim()).filter(Boolean)) {
              const [target, ...flags] = line.split(/\s+/);
              try {
                if (target.startsWith('wd:')) {
                  const q = target.slice(3);
                  const r = await ctx.request.get(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${q}&props=sitelinks/urls&sitefilter=dewiki&format=json`);
                  const j = await r.json(); await sleep(1000);
                  const w = j.entities[q].sitelinks && j.entities[q].sitelinks.dewiki;
                  if (w) await visit(ctx, w.url, []); else await post(`### ${q}: no dewiki sitelink`);
                  continue;
                }
                const links = await visit(ctx, target, flags);
                if (flags.includes('terms')) {
                  const host = new URL(target).host.replace(/^www\./, '');
                  const t = links.filter(([tx, h]) => /impressum|nutzungsbeding|\bagb\b|terms|legal|rechtlich|disclaimer|haftung/i.test(tx + ' ' + h) && new URL(h).host.replace(/^www\./, '').endsWith(host)).slice(0, 3);
                  for (const [tx, h] of t) await visit(ctx, h, []);
                  if (!t.length) await post(`### ${target}: no terms or legal-notice link found`);
                }
              } catch (e) { await post(`### ${line}: ERROR ${e.message.slice(0, 200)}`); }
            }
            await browser.close();
          })();
          JS
          cd /tmp && NODE_PATH=/tmp/pw/node_modules node /tmp/probe.js
