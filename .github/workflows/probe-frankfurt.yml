# TEMPORARY: reads Eintracht Frankfurt's own ticket pages for the ticket
# research PR and posts their text and links as PR comments. Deleted before merge.
name: Probe Frankfurt ticket pages

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ROBOTS: |
            stores.eintracht.de
            mitglied.eintracht.de
          FULL: |
            https://stores.eintracht.de/rechtliches/atgb-maenner/
            https://stores.eintracht.de/rechtliches/agb-ticketboerse/
          PAGES: |
            https://stores.eintracht.de/rechtliches/atgb-maenner/
            https://stores.eintracht.de/rechtliches/agb-ticketboerse/
            https://mitglied.eintracht.de/vorteile/tickets-dauerkarten/
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.js <<'JS'
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const UA = 'FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)';
          const MAX = 60000;
          const FORBIDDEN = /checkout|cart|warenkorb|login|queue|waiting/i;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let n = 0;
          function post(body) {
            fs.writeFileSync(`c${++n}.md`, body);
            execFileSync('gh', ['api', `repos/${process.env.REPO}/issues/${process.env.PR}/comments`,
              '-F', `body=@c${n}.md`], { stdio: ['ignore', 'ignore', 'inherit'] });
          }
          const lines = s => (s || '').split('\n').map(x => x.trim()).filter(Boolean);

          // robots.txt: groups for this bot win over the * group; longest match wins.
          const robots = {};
          async function fetchRobots(host) {
            let status, text = '';
            for (const limit of [30000, 90000]) {
              await sleep(1000);
              try {
                const r = await fetch(`https://${host}/robots.txt`,
                  { headers: { 'User-Agent': UA }, signal: AbortSignal.timeout(limit) });
                status = r.status; text = await r.text(); break;
              } catch (e) { status = `error (${limit / 1000} s limit): ${e.message}`; }
            }
            post(`### robots.txt of ${host}\nHTTP ${status}\n\n\`\`\`\n${text.slice(0, MAX)}\n\`\`\``);
            const groups = []; let cur = null, lastWasUA = false;
            for (const raw of text.split('\n')) {
              const m = raw.replace(/#.*/, '').trim().match(/^([^:]+):\s*(.*)$/);
              if (!m) continue; const k = m[1].toLowerCase(), v = m[2].trim();
              if (k === 'user-agent') { if (!lastWasUA) { cur = { agents: [], rules: [] }; groups.push(cur); } cur.agents.push(v.toLowerCase()); lastWasUA = true; }
              else { lastWasUA = false; if (cur && (k === 'allow' || k === 'disallow')) cur.rules.push([k, v]); }
            }
            const own = groups.filter(g => g.agents.some(a => a !== '*' && 'footballplannerbot'.startsWith(a)));
            const rules = (own.length ? own : groups.filter(g => g.agents.includes('*'))).flatMap(g => g.rules);
            const blocked = status === 401 || status === 403 || typeof status !== 'number';
            return robots[host] = { status, rules, blocked };
          }
          function allowed(host, path) {
            const rb = robots[host];
            if (!rb) return [false, 'robots.txt of this host was not read'];
            if (rb.blocked) return [false, `robots.txt answered ${rb.status}`];
            let best = null;
            for (const [k, v] of rb.rules) {
              if (!v) continue;
              const re = new RegExp('^' + v.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*').replace(/\\\$$/, '$'));
              if (re.test(path) && (!best || v.length > best[1].length || (v.length === best[1].length && k === 'allow'))) best = [k, v];
            }
            return best && best[0] === 'disallow' ? [false, `Disallow: ${best[1]}`] : [true, best ? `${best[0]}: ${best[1]}` : 'no matching rule'];
          }

          async function render(browser, url) {
            const u = new URL(url);
            if (FORBIDDEN.test(url)) { post(`### STOPPED ${url}\nForbidden URL (checkout/cart/login/queue/waiting); not opened.`); return; }
            const [ok, why] = allowed(u.host, u.pathname + u.search);
            if (!ok) { post(`### STOPPED ${url}\nrobots.txt: ${why}; not opened.`); return; }
            let resp, err = '', used = 0;
            let ctx, page;
            for (const limit of [45000, 90000]) {
              if (ctx) await ctx.close();
              ctx = await browser.newContext({ userAgent: UA, locale: 'de-DE' });
              page = await ctx.newPage();
              // Never follow a navigation (link, redirect, script) to a forbidden URL.
              await page.route('**/*', r => (r.request().isNavigationRequest() && FORBIDDEN.test(r.request().url())) ? r.abort() : r.continue());
              await sleep(1000);
              try { resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: limit }); err = ''; used = limit; break; }
              catch (e) { err = `${e.message.split('\n')[0]} (limit ${limit / 1000} s)`; }
            }
            if (err) { post(`### FAILED ${url}\n${err}; tried twice (45 s, then 90 s).`); await ctx.close(); return; }
            let idle = 'yes';
            try { await page.waitForLoadState('networkidle', { timeout: 30000 }); } catch { idle = 'no (30 s limit)'; }
            await sleep(3000);
            const status = resp ? resp.status() : 'none';
            const final = page.url();
            // A server redirect is not seen by page.route: refuse to record it.
            if (FORBIDDEN.test(final)) { post(`### STOPPED ${url}\nRedirected to a forbidden URL (login/checkout/queue); nothing recorded.`); await ctx.close(); return; }
            const title = await page.title();
            const text = await page.evaluate(() => {
              const b = document.body.cloneNode(true);
              b.querySelectorAll('script,style,noscript').forEach(e => e.remove());
              return b.textContent.replace(/[ \t\r\f\v ]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();
            });
            const challenge = /just a moment|captcha|attention required|verify you are human/i.test(title + '\n' + text.slice(0, 3000));
            if (status === 403 || challenge) {
              post(`### STOPPED ${url}\nHTTP ${status}, title "${title}"${challenge ? ', bot challenge text found' : ''}; nothing read.`);
              await ctx.close(); return;
            }
            const head = `URL: ${url}\nFinal URL: ${final}\nHTTP ${status}; title "${title}"; network idle: ${idle}; load limit used ${used / 1000} s\n`;
            const cut = text.length > MAX;
            // FULL pages: the whole text, in parts of MAX characters each.
            const full = lines(process.env.FULL).includes(url);
            const parts = full ? Math.ceil(text.length / MAX) : 1;
            for (let i = 0; i < parts; i++)
              post(`### (a) TEXT${parts > 1 ? ` part ${i + 1} of ${parts}` : ''} ${url}\n${head}Length ${text.length} characters${full ? `, characters ${i * MAX} to ${Math.min(text.length, (i + 1) * MAX)}` : cut ? `, CUT at ${MAX}` : ', not cut'}.\n\n\`\`\`\n${text.slice(i * MAX, (i + 1) * MAX).replace(/```/g, "'''")}\n\`\`\``);
            const links = await page.evaluate(() => [...document.querySelectorAll('a[href]')].map(a =>
              `${(a.textContent || a.getAttribute('aria-label') || a.title || '').replace(/\s+/g, ' ').trim()} | ${a.href}`));
            const uniq = [...new Set(links)];
            post(`### (b) LINKS ${url}\n${uniq.length} distinct links${uniq.length > 150 ? ', showing the first 150' : ''}.\n\n\`\`\`\n${uniq.slice(0, 150).join('\n').replace(/```/g, "'''")}\n\`\`\``);
            await ctx.close();
          }

          (async () => {
            let browser;
            try {
              for (const h of lines(process.env.ROBOTS)) await fetchRobots(h);
              const { chromium } = require('/tmp/pw/node_modules/playwright');
              browser = await chromium.launch();
              for (const url of lines(process.env.PAGES)) {
                try { await render(browser, url); }
                catch (e) { post(`### ERROR ${url}\n\`\`\`\n${String(e && e.stack || e).slice(0, 3000)}\n\`\`\``); }
              }
              post('### Probe run finished');
            } catch (e) {
              try { post(`### PROBE ERROR\n\`\`\`\n${String(e && e.stack || e).slice(0, 3000)}\n\`\`\``); } catch {}
              process.exitCode = 1;
            } finally { if (browser) await browser.close(); }
          })();
          JS
          node probe.js
