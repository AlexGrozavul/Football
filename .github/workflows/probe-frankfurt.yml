# TEMPORARY: reads Eintracht Frankfurt's own ticket pages for the ticket
# research PR and posts their text as PR comments. Deleted before merge.
name: Probe Frankfurt ticket pages

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LANDING: https://www.eintracht.de/tickets/
          # Empty: stage 1 (robots.txt, landing page, its ticket links).
          # One URL per line: stage 2 (robots.txt, then these pages only).
          PAGES: ""
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.js <<'JS'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const UA = 'FootballPlannerBot/1.0 (https://github.com/AlexGrozavul/Football)';
          const MAX = 60000;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let n = 0;
          function post(body) {
            fs.writeFileSync(`c${++n}.md`, body);
            execFileSync('gh', ['api', `repos/${process.env.REPO}/issues/${process.env.PR}/comments`,
              '-F', `body=@c${n}.md`], { stdio: ['ignore', 'ignore', 'inherit'] });
          }
          const robots = {};
          async function robotsFor(host) {
            if (host in robots) return robots[host];
            await sleep(1000);
            let status, text = '';
            try {
              const r = await fetch(`https://${host}/robots.txt`, { headers: { 'User-Agent': UA } });
              status = r.status; text = await r.text();
            } catch (e) { status = 'error: ' + e.message; }
            post(`### robots.txt of ${host}\nHTTP ${status}\n\n\`\`\`\n${text.slice(0, MAX)}\n\`\`\``);
            // Groups for * and for this bot; the bot's own group wins if present.
            const groups = []; let cur = null, lastWasUA = false;
            for (const raw of text.split('\n')) {
              const line = raw.replace(/#.*/, '').trim(); const m = line.match(/^([^:]+):\s*(.*)$/);
              if (!m) continue; const k = m[1].toLowerCase(), v = m[2];
              if (k === 'user-agent') { if (!lastWasUA) { cur = { agents: [], rules: [] }; groups.push(cur); } cur.agents.push(v.toLowerCase()); lastWasUA = true; }
              else { lastWasUA = false; if (cur && (k === 'allow' || k === 'disallow')) cur.rules.push([k, v]); }
            }
            const own = groups.filter(g => g.agents.some(a => a !== '*' && 'footballplannerbot'.startsWith(a)));
            const rules = (own.length ? own : groups.filter(g => g.agents.includes('*'))).flatMap(g => g.rules);
            const ok = typeof status === 'number' && status < 500 && !(status === 401 || status === 403);
            return robots[host] = { ok, status, rules };
          }
          function allowed(rb, path) {
            let best = null;
            for (const [k, v] of rb.rules) {
              if (!v) continue;
              const re = new RegExp('^' + v.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*').replace(/\\\$$/, '$'));
              if (re.test(path) && (!best || v.length > best[1].length || (v.length === best[1].length && k === 'allow'))) best = [k, v];
            }
            return best ? [best[0] === 'allow', best] : [true, null];
          }
          async function render(browser, url, wantLinks) {
            const u = new URL(url);
            const rb = await robotsFor(u.host);
            if (!rb.ok) { post(`### STOPPED ${url}\nrobots.txt of ${u.host} answered ${rb.status}; page not fetched.`); return null; }
            const [ok, rule] = allowed(rb, u.pathname + u.search);
            if (!ok) { post(`### STOPPED ${url}\nrobots.txt disallows it (${rule[0]}: ${rule[1]}); page not fetched.`); return null; }
            await sleep(1000);
            const page = await browser.newPage({ userAgent: UA });
            let status = '?', idle = 'yes';
            try {
              const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              status = resp ? resp.status() : '?';
              try { await page.waitForLoadState('networkidle', { timeout: 30000 }); } catch { idle = 'no (30 s limit reached)'; }
            } catch (e) { post(`### STOPPED ${url}\nload failed: ${e.message.split('\n')[0]}`); await page.close(); return null; }
            const title = await page.title();
            const text = await page.evaluate(() => {
              const b = document.body.cloneNode(true);
              b.querySelectorAll('script,style,noscript').forEach(e => e.remove());
              return b.textContent.replace(/[ \t\r\f\v ]+/g, ' ').replace(/ ?\n[\s]*/g, '\n').trim();
            });
            const finalUrl = page.url();
            const challenge = /just a moment|captcha|attention required|access denied|cf-chl|verify you are human/i.test(title + '\n' + text.slice(0, 3000));
            if (status === 403 || status === 429 || challenge) {
              post(`### STOPPED ${url}\nHTTP ${status}, title "${title}"${challenge ? ', bot challenge or block text found' : ''}; nothing else tried.`);
              await page.close(); return null;
            }
            const cut = text.length > MAX;
            post(`### PAGE ${url}\nfinal URL ${finalUrl} - HTTP ${status} - title "${title}" - network idle: ${idle} - ${text.length} chars${cut ? `, CUT at ${MAX}` : ''}\n\n\`\`\`\n${text.slice(0, MAX).replace(/```/g, "'''")}\n\`\`\``);
            let links = null;
            if (wantLinks) {
              const all = await page.evaluate(() => [...document.querySelectorAll('a[href]')].map(a => [a.href, a.textContent.replace(/\s+/g, ' ').trim()]));
              const seen = new Set(); links = [];
              for (const [h, t] of all) {
                const s = (h + ' ' + t).toLowerCase();
                if (/ticket|karten|mitglied|dauerkarte|gast|auswaerts|auswärts/.test(s) && !seen.has(h)) { seen.add(h); links.push(`- ${h} — ${t.slice(0, 80)}`); }
              }
              post(`### LINKS on ${finalUrl} (${links.length} matching${links.length > 60 ? ', first 60 shown' : ''})\n${links.slice(0, 60).join('\n')}`);
            }
            await page.close();
            return text;
          }
          (async () => {
            const browser = await chromium.launch();
            const pages = (process.env.PAGES || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12);
            if (!pages.length) await render(browser, process.env.LANDING, true);
            for (const p of pages) await render(browser, p, false);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node probe.js
