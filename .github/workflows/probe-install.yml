name: Probe install
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Environment
        run: |
          head -n 3 /etc/os-release
          node -v
          npm -v

      - name: Install, with output
        id: probe
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          {
            npm init -y >/dev/null
            echo "--- npm install"
            npm install --no-audit --no-fund playwright@1.56.1 2>&1 | tail -n 40
            echo "npm install exit: ${PIPESTATUS[0]}"
            echo "--- playwright install"
            npx playwright install --with-deps chromium 2>&1 | tail -n 40
            echo "playwright install exit: ${PIPESTATUS[0]}"
          } > /tmp/probe.txt 2>&1 || true
          { head -n 3 /etc/os-release; node -v; npm -v; cat /tmp/probe.txt; } | tee /tmp/probe-all.txt

      - name: Post output as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf 'probe-install output\n\n```\n%s\n```\n' "$(tail -c 60000 /tmp/probe-all.txt)")
          jq -n --arg b "$body" '{body:$b}' > /tmp/body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/body.json -o /dev/null -w '%{http_code}\n'
