name: Propose a country

# The repeatable part of adding a country (tiers 1 and 2): reads the season
# articles' rosters, the league items and every club item tagged with them,
# and writes EVIDENCE for the decisions a person makes - never a decision.
#
# READ-ONLY with respect to every hand-written file and every club file. The
# only files it writes are data/clubs/proposal-<CC>.csv and .md, which it
# commits, like the other review-file workflows. Run by hand only: a new
# country is a new decision, not a schedule.
#
# Inputs: the country code as the club files use it, the Wikidata item of
# the country, the English Wikipedia season article of each tracked tier
# (the en dash is not optional), optional extra label languages, and
# optionally the league items when they cannot be found from the article.

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country code as the club files use it (PT, NL, ...)"
        required: true
      country_qid:
        description: "Wikidata item of the country (Q45)"
        required: true
      tier1_article:
        description: "English Wikipedia season article, tier 1 (2026–27 Primeira Liga)"
        required: true
      tier2_article:
        description: "English Wikipedia season article, tier 2 (leave empty for one tier)"
        required: false
        default: ""
      below_articles:
        description: "Lower-division season articles, separated by ; (used only as evidence for extras)"
        required: false
        default: ""
      langs:
        description: "Extra label languages, comma separated (pt)"
        required: false
        default: ""
      leagues:
        description: "Only if the league items cannot be found from the articles: 1=Q...,2=Q..."
        required: false
        default: ""
      grounds:
        description: "Also propose grounds and capacities (reads StadiumDB; OpenStreetMap is not asked while Overpass robots.txt disallows /api/)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: propose-country-${{ inputs.country }}
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Offline test of the classification
        run: python3 tools/test_propose_country.py

      - name: Propose the country
        env:
          CC: ${{ inputs.country }}
          CQ: ${{ inputs.country_qid }}
          T1: ${{ inputs.tier1_article }}
          T2: ${{ inputs.tier2_article }}
          LANGS: ${{ inputs.langs }}
          BELOW: ${{ inputs.below_articles }}
          LEAGUES: ${{ inputs.leagues }}
          GROUNDS: ${{ inputs.grounds }}
        run: |
          set -o pipefail
          args=(--country "$CC" --country-qid "$CQ" --article "1=$T1")
          if [ -n "$T2" ]; then args+=(--article "2=$T2"); fi
          if [ -n "$LANGS" ]; then args+=(--langs "$LANGS"); fi
          if [ "$GROUNDS" = "true" ]; then args+=(--grounds); fi
          IFS=';' read -ra B <<< "$BELOW"
          for b in "${B[@]}"; do if [ -n "$b" ]; then args+=(--below "$b"); fi; done
          IFS=',' read -ra L <<< "$LEAGUES"
          for l in "${L[@]}"; do if [ -n "$l" ]; then args+=(--league "$l"); fi; done
          python3 tools/propose_country.py "${args[@]}" | tee /tmp/propose.log

      - name: Write the run summary
        if: always()
        env:
          CC: ${{ inputs.country }}
        run: |
          {
            echo "## Proposal for $CC"
            echo
            echo '```'
            tail -n 60 /tmp/propose.log 2>/dev/null || echo "the tool did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the proposal changed
        env:
          CC: ${{ inputs.country }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/clubs/proposal-${CC}.csv" "data/clubs/proposal-${CC}.md" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          git commit -m "chore: country proposal ${CC} ($(date -u +%Y-%m-%d))"

          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
