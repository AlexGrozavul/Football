name: Build calendars

# Two things in one run:
#   1. fetch fixtures from football-data.org into data/fixtures/
#   2. rebuild calendars/*.ics from the hand-written files
# Commits only when something actually changed.

on:
  schedule:
    # 05:17 UTC daily. Deliberately off the hour: scheduled jobs queued
    # at :00 sit behind everyone else's and can be delayed by 15-30 min.
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "data/football-rules.json"
      - "data/fixtures-manual.csv"
      - "tools/build_calendars.py"
      - "tools/check_sale_dates.py"
      - "tools/fetch_fixtures.py"
      - ".github/workflows/build-calendars.yml"
  # CI guard test: on a pull request that changes this file, the build and
  # the guard run, and the commit step is skipped (docs/claude/conventions.md,
  # "CI guard").
  pull_request:
    paths:
      - ".github/workflows/build-calendars.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-calendars${{ github.event_name == 'pull_request' && format('-pr-{0}', github.ref) || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch fixtures from football-data.org
        # Skipped on push: editing the CSV or the rules file should not
        # spend API calls. Runs on the daily schedule and on Run workflow.
        # Never blocks the calendar build if it fails.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -o pipefail
          python3 tools/fetch_fixtures.py | tee /tmp/fetch.log

      - name: Validate the JSON before touching anything
        run: |
          python3 - <<'PY'
          import json, sys
          path = "data/football-rules.json"
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
          except FileNotFoundError:
              sys.exit(f"{path} is missing")
          except json.JSONDecodeError as exc:
              sys.exit(f"{path} is not valid JSON: line {exc.lineno}, column {exc.colno}: {exc.msg}")
          for key in ("ticketEvents", "bucketList", "clubs"):
              if key not in data:
                  sys.exit(f"{path} has no {key!r} key")
          print(f"OK: {len(data['ticketEvents'])} ticketEvents, "
                f"{len(data['bucketList'])} bucketList, {len(data['clubs'])} clubs")
          PY

      - name: Check the dated sale entries (warnings only)
        # Offline, never fails the build: CLAUDE.md rule 8.
        run: python3 tools/check_sale_dates.py || true

      - name: Build the calendars
        run: |
          set -o pipefail
          python3 tools/build_calendars.py | tee /tmp/build.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Calendar build"
            echo
            echo '```'
            cat /tmp/build.log 2>/dev/null || echo "build did not run"
            echo '```'
            if [ -f calendars/skipped.md ]; then
              echo
              echo "<details><summary>Skipped entries</summary>"
              echo
              tail -n +6 calendars/skipped.md
              echo
              echo "</details>"
            fi
            if [ -f /tmp/fetch.log ]; then
              echo
              echo "## Fixture fetch"
              echo
              echo '```'
              cat /tmp/fetch.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # CI guard (docs/claude/conventions.md, "CI guard"): the commit below is
      # pushed with the Actions token, which starts no other workflow, so
      # "Test the page" never sees it. The suites that read the rewritten
      # files (data/fixtures/*.json (calendars/ is not read by the page)) run here instead; if one fails, the
      # commit step is skipped, nothing is pushed and the run is red.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium (CI guard)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: CI guard - test the rewritten files before committing
        id: guard
        run: tools/ci_guard.sh test_derbies test_nearme

      - name: Commit only if the output changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendars/
          if [ -d data/fixtures ]; then
            git add data/fixtures/
          fi

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild calendars and fixtures ($(date -u +%Y-%m-%d))"

          # Retry once: a hand edit pushed while this job was running would
          # otherwise make the push fail outright.
          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
