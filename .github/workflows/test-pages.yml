name: Test the page

# Opens index.html in headless Chromium at phone width (390x844) and runs
# the page tests: the installable app (tools/test_pwa.js), the derbies
# panel (tools/test_derbies.js), the route panel with saved routes
# (tools/test_routes.js), and since 2026-10-03 the zoom rule
# (tools/test_zoom.js - fails if any club on the map is not drawn at the
# tier-3 threshold, z9, and prints the redraw timing at 4x CPU), the club
# search (tools/test_search.js), the coverage panel
# (tools/test_coverage.js) and the ticket section of the club sheet
# (tools/test_sheet_tickets.js), and since the same day the layout at
# phone width (tools/test_layout.js - fails if the Ticket info tab or a
# club sheet with ticket information is wider than the screen, if the
# sheet can be pulled off the bottom bar, if the Wikidata id is back on
# the distance note, if the Fixtures or Ticket info sections name a file
# outside a "Why?" line, or if "Next window" words an empty answer
# wrongly), and since the same day the collapsible tier legend
# (tools/test_legend.js - fails if the legend does not start closed, does
# not toggle, lacks its "Leagues shown" header above every row, overlaps
# the attribution bar or the bottom navigation at 390x700 and 390x500, or
# forgets its choice on reload), and since the same day the Near me panel
# (tools/test_nearme.js - its Clubs and Derbies tabs, the list against the
# club files, the slider and tier chips, tapping a row including the
# Grünwalder pair, "Use my location" granted, denied and timed out with the
# position never stored or sent, and the top row at 390x700 and 390x500;
# the derbies test reaches the derbies through the panel's tab). Each one
# serves the checkout locally,
# stubs every Stadia Maps request (tiles, routing, place search) so no
# credit is spent, and fails on a script error. A failing test turns the
# run red.
#
# Runs on a change to the page, the service worker, the manifest, the
# tests or this file: on a push to main, and on a pull request, so a
# working branch is tested before it is merged.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tools/test_*.js"
      - "data/football-rules-links.csv"
      - ".github/workflows/test-pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tools/test_*.js"
      - "data/football-rules-links.csv"
      - ".github/workflows/test-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Playwright is not a dependency of this repo; it is installed here,
      # pinned, outside the checkout.
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # test_pwa.js edits files in the site it serves, so it gets a copy.
      - name: Installable app
        run: |
          set -o pipefail
          mkdir -p /tmp/site/Football /tmp/pwa
          git ls-files -z | xargs -0 cp --parents -t /tmp/site/Football
          NODE_PATH=/tmp/pw/node_modules node tools/test_pwa.js /tmp/site /tmp/pwa 2>&1 | tee /tmp/test_pwa.log

      - name: Derbies panel
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_derbies.js . 2>&1 | tee /tmp/test_derbies.log

      - name: Route panel and saved routes
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/routes
          NODE_PATH=/tmp/pw/node_modules node tools/test_routes.js . /tmp/routes 2>&1 | tee /tmp/test_routes.log

      - name: Zoom rule (every club drawn at z9)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_zoom.js . 2>&1 | tee /tmp/test_zoom.log

      - name: Club search
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_search.js . 2>&1 | tee /tmp/test_search.log

      - name: Coverage panel
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_coverage.js . 2>&1 | tee /tmp/test_coverage.log

      - name: Ticket info on the club sheet
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_sheet_tickets.js . 2>&1 | tee /tmp/test_sheet_tickets.log

      - name: Layout at phone width
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_layout.js . 2>&1 | tee /tmp/test_layout.log

      - name: Collapsible legend
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_legend.js . 2>&1 | tee /tmp/test_legend.log

      - name: Near me panel (clubs near me, derbies tab, location)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_nearme.js . 2>&1 | tee /tmp/test_nearme.log

      - name: Write the run summary
        if: always()
        run: |
          {
            for t in pwa derbies routes zoom search coverage sheet_tickets layout legend nearme; do
              echo "## test_$t.js"
              echo
              echo '```'
              cat /tmp/test_$t.log 2>/dev/null || echo "did not run"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
