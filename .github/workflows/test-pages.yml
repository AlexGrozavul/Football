name: Test the page

# Opens index.html in headless Chromium at phone width (390x844) and runs
# the page tests: the installable app (tools/test_pwa.js), the derbies
# panel (tools/test_derbies.js), the route panel with saved routes
# (tools/test_routes.js), and since 2026-10-03 the zoom rule
# (tools/test_zoom.js - fails if any club on the map is not drawn at the
# tier-3 threshold, z9, and prints the redraw timing at 4x CPU), the club
# search (tools/test_search.js), the coverage panel
# (tools/test_coverage.js) and the ticket section of the club sheet
# (tools/test_sheet_tickets.js), and since the same day the layout at
# phone width (tools/test_layout.js - fails if the Ticket info tab or a
# club sheet with ticket information is wider than the screen, if the
# sheet can be pulled off the bottom bar, if the Wikidata id is back on
# the distance note, if the Fixtures or Ticket info sections name a file
# outside a "Why?" line, or if "Next window" words an empty answer
# wrongly), and since the same day the collapsible tier legend
# (tools/test_legend.js - fails if the legend does not start closed, does
# not toggle, lacks its "Leagues shown" header above every row, overlaps
# the attribution bar or the bottom navigation at 390x700 and 390x500, or
# forgets its choice on reload), and since the same day the Near me panel
# (tools/test_nearme.js - its Clubs and Derbies tabs, the list against the
# club files, the slider and tier chips, tapping a row including the
# Grünwalder pair, "Use my location" granted, denied and timed out with the
# position never stored or sent, and the top row at 390x700 and 390x500;
# the derbies test reaches the derbies through the panel's tab), and since
# 2026-10-04 the Ticket info and Bucket list tabs
# (tools/test_tickets_bucket.js - every card opened at 390 px: no sideways
# scroll, Italy's rules above Inter's, Nürnberg's "no national rules" line,
# no upcoming-dates section on Ticket info, every ticket event reachable
# from the Bucket list, the Frankenderby and Milan derby clubs, and no
# estimated date shown to the day) and the ticket files' own checker
# (tools/check_tickets.py, which must exit 0), and since the same day the
# Bucket list's List and Calendar sub-tabs (tools/test_calendar.js - no
# sideways scroll on either, the sort and the star working and surviving a
# reload, an estimated item never on a day cell, holidays shaded on exactly
# their days, a month outside the entered holidays saying so, the sheet a
# tapped item opens matching the List, all under Europe/Berlin and UTC) and
# the holidays file's own checker (tools/check_holidays.py, which must exit
# 0), and since the same day the Me tab (tools/test_me.js - four tabs fit at
# 390 px; memberships and tickets held added, edited, deleted and kept over a
# reload; a card number refused; "You hold tickets" on the linked bucket entry
# in the List, the sheet and the calendar; a valid .ics whose alarm matches
# the lead time; export, delete, import round trip; broken imports refused;
# no sideways scroll; nothing typed there in any request or in the repo),
# and since 2026-10-06 Karlsruher SC's ticket information
# (tools/test_ksc_tickets.js - KSC listed under Clubs on Ticket info with
# "Country rules: Germany" above its researched rules and its notes, every
# KSC rule and window in the entry, the same order on its club sheet, the
# Südwestderby entry with KSC as host and Kaiserslautern not researched, and
# no estimated date shown to the day anywhere it appears). Since the same day
# a change to the ticket files themselves also runs this workflow. Since
# 2026-10-07 VfB Stuttgart's ticket information (tools/test_vfb_tickets.js -
# VfB under Clubs with "Country rules: Germany" above its researched rules
# and its notes, every VfB rule, window and phase shown and its price and
# sell-out sections holding every row, the same on its club sheet; the Bucket
# list has no VfB entry (vfb-regular was removed 2026-10-08); no estimated date
# is shown to the day).
# Each one
# serves the checkout locally,
# stubs every Stadia Maps request (tiles, routing, place search) so no
# credit is spent, and fails on a script error. A failing test turns the
# run red.
#
# Runs on a change to the page, the service worker, the manifest, the
# tests or this file: on a push to main, and on a pull request, so a
# working branch is tested before it is merged.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tools/test_*.js"
      - "data/football-rules-links.csv"
      - "data/bucket-links-manual.csv"
      - "data/event-ticket-rules.csv"
      - "data/holidays-manual.csv"
      - "tools/check_holidays.py"
      - "data/club-ticket*.csv"
      - "data/club-tickets.csv"
      - "data/country-ticket-rules.csv"
      - "data/ticket-sources.csv"
      - "tools/check_tickets.py"
      - "data/competitions.csv"
      - "data/competition-info.csv"
      - "data/competition-sources.csv"
      - "tools/check_competitions.py"
      - "data/club-rivalries.csv"
      - "data/club-atmosphere.csv"
      - "data/club-culture-sources.csv"
      - "tools/check_club_culture.py"
      - "data/football-rules.json"
      - ".github/workflows/test-pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "tools/test_*.js"
      - "data/football-rules-links.csv"
      - "data/bucket-links-manual.csv"
      - "data/event-ticket-rules.csv"
      - "data/holidays-manual.csv"
      - "tools/check_holidays.py"
      - "data/club-ticket*.csv"
      - "data/club-tickets.csv"
      - "data/country-ticket-rules.csv"
      - "data/ticket-sources.csv"
      - "tools/check_tickets.py"
      - "data/competitions.csv"
      - "data/competition-info.csv"
      - "data/competition-sources.csv"
      - "tools/check_competitions.py"
      - "data/club-rivalries.csv"
      - "data/club-atmosphere.csv"
      - "data/club-culture-sources.csv"
      - "tools/check_club_culture.py"
      - "data/football-rules.json"
      - ".github/workflows/test-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Playwright is not a dependency of this repo; it is installed here,
      # pinned, outside the checkout.
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # test_pwa.js edits files in the site it serves, so it gets a copy.
      - name: Installable app
        run: |
          set -o pipefail
          mkdir -p /tmp/site/Football /tmp/pwa
          git ls-files -z | xargs -0 cp --parents -t /tmp/site/Football
          NODE_PATH=/tmp/pw/node_modules node tools/test_pwa.js /tmp/site /tmp/pwa 2>&1 | tee /tmp/test_pwa.log

      - name: Derbies panel
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_derbies.js . 2>&1 | tee /tmp/test_derbies.log

      - name: Route panel and saved routes
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/routes
          NODE_PATH=/tmp/pw/node_modules node tools/test_routes.js . /tmp/routes 2>&1 | tee /tmp/test_routes.log

      - name: Zoom rule (every club drawn at z9)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_zoom.js . 2>&1 | tee /tmp/test_zoom.log

      - name: Club search
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_search.js . 2>&1 | tee /tmp/test_search.log

      - name: Coverage panel
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_coverage.js . 2>&1 | tee /tmp/test_coverage.log

      - name: Ticket info on the club sheet
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_sheet_tickets.js . 2>&1 | tee /tmp/test_sheet_tickets.log

      - name: Layout at phone width
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_layout.js . 2>&1 | tee /tmp/test_layout.log

      - name: Collapsible legend
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_legend.js . 2>&1 | tee /tmp/test_legend.log

      - name: Near me panel (clubs near me, derbies tab, location)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_nearme.js . 2>&1 | tee /tmp/test_nearme.log

      - name: Ticket info and Bucket list tabs
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_tickets_bucket.js . 2>&1 | tee /tmp/test_tickets_bucket.log

      - name: Bucket list - calendar, favorites and sort
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_calendar.js . 2>&1 | tee /tmp/test_calendar.log

      - name: Me tab - memberships, tickets held, export and import
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_me.js . 2>&1 | tee /tmp/test_me.log

      - name: Karlsruher SC ticket information (Ticket info, sheet, Südwestderby)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_ksc_tickets.js . 2>&1 | tee /tmp/test_ksc_tickets.log

      - name: VfB Stuttgart ticket information (Ticket info, sheet, Bucket list)
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_vfb_tickets.js . 2>&1 | tee /tmp/test_vfb_tickets.log

      - name: Competitions tab and the Bucket list filter chip
        if: always()
        run: |
          set -o pipefail
          NODE_PATH=/tmp/pw/node_modules node tools/test_competitions.js . 2>&1 | tee /tmp/test_competitions.log

      # The Competitions tab reads three hand-written files; their own checker must pass too.
      # Day-level future dates, an unknown topic, status or id fail it; a row with no source or
      # check date, or one checked over 365 days ago, only warns.
      - name: Competition files read back (check_competitions.py exits 0)
        if: always()
        run: |
          set -o pipefail
          python3 tools/check_competitions.py 2>&1 | tee /tmp/test_check_competitions.log

      # The calendar reads the holidays file; its own checker must pass too.
      - name: School holidays read back (check_holidays.py exits 0)
        if: always()
        run: |
          set -o pipefail
          python3 tools/check_holidays.py 2>&1 | tee /tmp/test_check_holidays.log

      # The page reads the ticket files; their own checker must pass too.
      - name: Ticket files read back (check_tickets.py exits 0)
        if: always()
        run: |
          set -o pipefail
          python3 tools/check_tickets.py 2>&1 | tee /tmp/test_check_tickets.log

      # The club sheet's Rivalries and atmosphere sections read these files; their checker must pass too.
      - name: Club culture files read back (check_club_culture.py exits 0)
        if: always()
        run: |
          set -o pipefail
          python3 tools/check_club_culture.py 2>&1 | tee /tmp/test_check_club_culture.log

      - name: Write the run summary
        if: always()
        run: |
          {
            for t in pwa derbies routes zoom search coverage sheet_tickets layout legend nearme tickets_bucket calendar me ksc_tickets vfb_tickets competitions check_tickets check_holidays check_competitions check_club_culture; do
              echo "## test_$t.js"
              echo
              echo '```'
              cat /tmp/test_$t.log 2>/dev/null || echo "did not run"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
