name: Probe audit (temporary)

# TEMPORARY - capacity audit, phase 1d. Starts only when this file is part
# of a pull request's diff; removed before the merge. Reads Wikidata,
# Wikipedia, StadiumDB and the pages their link lists name, with a
# descriptive User-Agent, at most one request per second to Wikimedia,
# maxlag=5 (never raised: on a lag refusal the probe waits and retries).
# Commits nothing.

on:
  pull_request:
    paths: ['.github/workflows/probe-audit.yml']

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: probe-audit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          PROBE_RUN: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/probe/probe_audit.py
