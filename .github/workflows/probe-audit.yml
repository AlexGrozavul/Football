name: Probe audit (temporary)
# Temporary, phase 4a (competitions). Starts only when this file changes. Removed before merge.
on:
  pull_request:
    paths: ['.github/workflows/probe-audit.yml']
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: PDF text tool
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Read pages and post matching sentences
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_LABEL: run3
        run: python3 .github/probe/probe.py .github/probe/pages.tsv
