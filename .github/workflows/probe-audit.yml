name: Probe audit (temporary)
# Temporary, phase 5b session 2 (quote-less other rivalry rows). Runs only when the head commit message contains [probe]. Removed before merge.
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      probe: ${{ steps.msg.outputs.probe }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: msg
        run: |
          if git log -1 --format=%B | grep -qF '[probe]'; then echo "probe=true" >> "$GITHUB_OUTPUT"; else echo "probe=false" >> "$GITHUB_OUTPUT"; fi
  probe:
    needs: gate
    if: needs.gate.outputs.probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read pages and post matching sentences
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: RUN_LABEL="$(git log -1 --format=%s | grep -o 'run[0-9]*' | head -1)" python3 .github/probe/probe.py .github/probe/pages.tsv
