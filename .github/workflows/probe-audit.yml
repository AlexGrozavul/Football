name: Probe audit (temporary)

# TEMPORARY - grounds and coordinates audit, phase 1e. Starts only when this
# file is part of a pull request's diff; removed before the merge. Reads
# Wikipedia season articles, OpenStreetMap (Overpass, Nominatim) and a few
# club pages, with a descriptive User-Agent, at most one request per second
# per host, Wikimedia with maxlag=5 (never raised: on a lag refusal the probe
# waits and retries). Commits nothing.

on:
  pull_request:
    paths: ['.github/workflows/probe-audit.yml']

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: probe-audit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probe
        env:
          PROBE_RUN: "3"
          PROBE_STAGES: "C,B3"
          WD_BUDGET: "420"
          NODE_PATH: /tmp/pw/node_modules
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/probe/probe_audit.py
