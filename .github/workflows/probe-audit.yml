# TEMPORARY: derby audit, phase 3a. Reads the Wikipedia articles the
# sampled derbies.csv rows name as their source and posts the matching
# lines as PR comments. Starts only when this file changes. Removed
# before the merge.
name: Probe audit (temporary)

on:
  pull_request:
    paths: ['.github/workflows/probe-audit.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_NUMBER_OF_THE_AUDIT: 4
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: python3 .github/probe/audit.py .github/probe/targets.json qids 8
      - name: Post the extracts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for f in /tmp/probe-comment-*.md; do
            gh pr comment "$PR" --repo "$REPO" --body-file "$f"
          done
