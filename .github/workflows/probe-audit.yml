# TEMPORARY: ticket data audit, phase 2a. Reads the source pages of the
# sampled ticket rows and posts text extracts as PR comments. Starts only
# when this file changes. Removed before the merge.
name: Probe audit (temporary)

on:
  pull_request:
    paths: ['.github/workflows/probe-audit.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      RUN_NUMBER_OF_THE_AUDIT: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Install Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: node .github/probe/audit.js .github/probe/targets.json
