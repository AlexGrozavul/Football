name: Link fixtures to clubs

# Rebuilds data/clubs/fixture-links.json, which tells the club sheet in
# the app which football-data.org and OpenLigaDB team each map club is,
# and data/clubs/fixture-link-review.csv, which lists everything the
# matcher would not decide on its own.
#
# Reads only files already in the repository - no network, no secret.
# Never touches calendars/: fetched fixtures feed the app, never a feed.
#
# Triggers:
#   - after each of the three workflows that change its inputs (the two
#     fixture fetches and the club layer build). Their commits are made
#     with the Actions token, and a push made that way does not start a
#     push-triggered workflow, which is why workflow_run is used here.
#   - on a push to main that edits the hand corrections or the tool.
#     As everywhere in this project, `paths` applies to pushes on main
#     only; on a working branch use "Run workflow".

on:
  workflow_run:
    workflows: ["Fetch OpenLigaDB fixtures", "Build calendars", "Build club layer"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/fixture-links-manual.csv"
      - "tools/link_fixtures.py"
      - "tools/crosscheck_stadiumdb.py"
      - ".github/workflows/link-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-fixtures
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # After a workflow_run, check out the branch head so the commit
          # the upstream run just pushed is included.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Link fixture teams to map clubs
        # Exits 1 on a problem - an unreadable file, or a rejected row in
        # data/fixture-links-manual.csv - so the run shows red.
        run: |
          set -o pipefail
          python3 tools/link_fixtures.py | tee /tmp/link.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Fixture links"
            echo
            echo '```'
            cat /tmp/link.log 2>/dev/null || echo "linker did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        # A rejected hand row still leaves a valid mapping from every
        # other row, so it is committed; the red step above says why.
        if: success() || failure()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/clubs/fixture-links.json data/clubs/fixture-link-review.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi

          git diff --cached --name-only
          git commit -m "chore: link fixtures to clubs ($(date -u +%Y-%m-%d))"

          branch="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          git push origin "HEAD:${branch}" || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${branch}"
            git push origin "HEAD:${branch}"
          }
