name: Build calendars

# Rebuilds calendars/*.ics from data/football-rules.json and commits the
# result, but only when something actually changed. The generator is
# deterministic, so a day with no data edits produces no commit.

on:
  schedule:
    # 05:17 UTC daily. Deliberately off the hour: scheduled jobs queued
    # at :00 sit behind everyone else's and can be delayed by 15-30 min.
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "data/football-rules.json"
      - "tools/build_calendars.py"
      - ".github/workflows/build-calendars.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-calendars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the JSON before touching anything
        run: |
          python3 - <<'PY'
          import json, sys
          path = "data/football-rules.json"
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
          except FileNotFoundError:
              sys.exit(f"{path} is missing")
          except json.JSONDecodeError as exc:
              sys.exit(f"{path} is not valid JSON: line {exc.lineno}, column {exc.colno}: {exc.msg}")
          for key in ("ticketEvents", "bucketList", "clubs"):
              if key not in data:
                  sys.exit(f"{path} has no {key!r} key")
          print(f"OK: {len(data['ticketEvents'])} ticketEvents, "
                f"{len(data['bucketList'])} bucketList, {len(data['clubs'])} clubs")
          PY

      - name: Build the calendars
        id: build
        run: |
          python3 tools/build_calendars.py | tee /tmp/build.log

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Calendar build"
            echo
            echo '```'
            cat /tmp/build.log 2>/dev/null || echo "build did not run"
            echo '```'
            if [ -f calendars/skipped.md ]; then
              echo
              echo "<details><summary>Skipped entries</summary>"
              echo
              tail -n +6 calendars/skipped.md
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendars/

          if git diff --cached --quiet; then
            echo "No change to calendars/. Nothing to commit."
            exit 0
          fi

          echo "Changed files:"
          git diff --cached --name-only

          git commit -m "chore: rebuild calendars ($(date -u +%Y-%m-%d))"

          # Retry once: a hand edit pushed while this job was running would
          # otherwise make the push fail outright.
          git push || {
            echo "Push rejected, rebasing onto origin and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          }
