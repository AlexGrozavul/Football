/* ------------------------------------------------------- bucket list */

function bucketCard(item){
  const bits = [];
  if(item.type)     bits.push(`<span class="tag">${esc(item.type)}</span>`);
  if(item.priority) bits.push(`<span class="tag">priority ${esc(item.priority)}</span>`);
  if(item.status){
    const cls = item.status === 'blocked' ? 'bad'
              : item.status === 'deferred' ? 'warn' : '';
    bits.push(`<span class="tag ${cls}">${esc(item.status)}</span>`);
  }
  if(item.trueDerby) bits.push('<span class="tag">true derby</span>');

  const km = roadEstimate(item.lat, item.lon);
  const dist = item.distanceKm ?? km;

  let dates = '';
  if(item.date) dates += field('Date', item.date + (item.kickoff ? ' · ' + item.kickoff : ''));
  if(item.nextFixture) dates += field('Next fixture',
      item.nextFixture.dateEstimate || item.nextFixture.date);
  if(Array.isArray(item.fixtures))
    item.fixtures.forEach(f => dates += field('Fixture', f.date));

  return `<div class="card">
    <h3>${esc(item.title || item.id)}</h3>
    ${item.why ? `<p>${esc(item.why)}</p>` : ''}
    <div class="meta">${bits.join('')}</div>
    ${dates}
    ${field('Venue', item.venue)}
    ${dist != null ? field('Distance', '≈ ' + dist + ' km') : field('Distance', null)}
    ${item.ticketRoute ? field('Tickets', item.ticketRoute) : ''}
    ${item.ticketNote ? field('Ticket note', item.ticketNote) : ''}
    ${item.blockedReason ? field('Blocked', item.blockedReason) : ''}
    ${item.unblockCondition ? field('Unblocks when', item.unblockCondition) : ''}
    ${item.deferReason ? field('Deferred', item.deferReason) : ''}
    ${item.conflict ? field('Clashes with', item.conflict) : ''}
    ${item.warning ? `<div class="meta"><span class="tag bad">${esc(item.warning)}</span></div>` : ''}
  </div>`;
}

function renderBucket(rules){
  const items = rules.bucketList || [];
  const rank = {high:0, medium:1, low:2};
  const live = items.filter(i => i.status !== 'blocked' && i.status !== 'deferred');
  const held = items.filter(i => i.status === 'blocked' || i.status === 'deferred');
  live.sort((a,b) => (rank[a.priority] ?? 9) - (rank[b.priority] ?? 9));

  document.getElementById('bucketBody').innerHTML =
    `<h2>Live — ${live.length}</h2>` + live.map(bucketCard).join('') +
    (held.length ? `<h2>Blocked or deferred — ${held.length}</h2>` +
      held.map(bucketCard).join('') : '') +
    `<p class="note">Distances are straight-line × ${MULTIPLIER}, measured from
     ${esc(HOME ? HOME.label : 'an unset home location')}. They are a road-distance
     estimate, not a travel time.</p>`;
}

/* ------------------------------------------------------- ticket info */

function ticketCard(ev, clubName){
  const when = ev.recurring === 'annual'
    ? ev.nextEstimate
    : (ev.date || ev.dateEstimate);

  return `<div class="card">
    <h3>${esc(ev.title || ev.id)}</h3>
    ${ev.action ? `<p>${esc(ev.action)}</p>` : ''}
    <div class="meta">
      ${sourceTag(ev.dateSource)}
      ${ev.feed ? `<span class="tag">${esc(ev.feed)}</span>` : ''}
      ${ev.status ? `<span class="tag">${esc(ev.status)}</span>` : ''}
      ${ev.recurring ? `<span class="tag">${esc(ev.recurring)}</span>` : ''}
    </div>
    ${field('Date', when)}
    ${field('Club', clubName)}
    ${field('Reminder', ev.leadTimeDays != null ? ev.leadTimeDays + ' days before' : null)}
    ${ev.rule ? field('Rule', ev.rule) : ''}
    ${ev.derivation ? field('Derived from', ev.derivation) : ''}
    ${ev.dependsOn ? field('Depends on', ev.dependsOn) : ''}
    ${ev.warning ? `<div class="meta"><span class="tag bad">${esc(ev.warning)}</span></div>` : ''}
  </div>`;
}

function renderTickets(rules){
  const clubs = {};
  (rules.clubs || []).forEach(c => clubs[c.id] = c.name);

  const events = (rules.ticketEvents || []).slice();
  const today = new Date().toISOString().slice(0,10);
  const dateOf = e => e.recurring === 'annual'
    ? e.nextEstimate : (e.date || e.dateEstimate) || '9999';

  const upcoming = events.filter(e => dateOf(e) >= today && e.dateSource !== 'disputed');
  const other    = events.filter(e => !(dateOf(e) >= today && e.dateSource !== 'disputed'));
  upcoming.sort((a,b) => dateOf(a).localeCompare(dateOf(b)));

  document.getElementById('ticketBody').innerHTML =
    `<h2>Ahead — ${upcoming.length}</h2>` +
    upcoming.map(e => ticketCard(e, clubs[e.club])).join('') +
    (other.length ? `<h2>Past, disputed or undated — ${other.length}</h2>` +
      other.map(e => ticketCard(e, clubs[e.club])).join('') : '') +
    `<p class="note">Every rule and date on this tab is hand-written in
     football-rules.json. Nothing here is generated, and a field shown as
     "not recorded" is blank in the file rather than unknown to the app.</p>`;
}

(async function start(){

  try{
    rules = await getJSON('data/football-rules.json');
  }catch(err){
    document.getElementById('bucketBody').innerHTML =
      `<p class="err">Could not load data/football-rules.json — ${esc(err.message)}</p>`;
    document.getElementById('ticketBody').innerHTML =
      document.getElementById('bucketBody').innerHTML;
  }

  if(rules && rules.settings){
    MULTIPLIER = rules.settings.estimateMultiplier ?? 1.25;
    const h = rules.settings.home || {};
    HOME = (h.lat != null && h.lon != null)
      ? {label: h.label || 'home', lat: h.lat, lon: h.lon}
      : HOME_FALLBACK;
    document.getElementById('homeChip').innerHTML =
      (h.lat != null ? '' : '⚠ ') + esc(HOME.label);
  }else{
    HOME = HOME_FALLBACK;
  }

  await initMap();
  if(rules){ renderBucket(rules); renderTickets(rules); }
})();
</script>
</body>
</html>
