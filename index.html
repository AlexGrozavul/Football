<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Football planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Leaflet is a copy in vendor/, not a CDN link, so the installed app
     opens offline. See CLAUDE.md, The installable app. -->
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#26303b; --ink:#e6edf3;
    --dim:#8b949e; --faint:#6b7681; --accent:#d9483b;
    --t1:#e8543f; --t2:#e8a33f; --t3:#3fa0e8; --t4:#2aab8e; --t5:#4caf50;
    --t6:#9b6bd6; --t7:#e8629f; --t8:#825e35;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100dvh}
  #panes{flex:1;position:relative;overflow:hidden}
  .pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
  .pane.on{display:block}
  #map{position:absolute;inset:0}

  nav{display:flex;border-top:1px solid var(--line);background:var(--panel);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--faint);padding:11px 4px 9px;
    font:inherit;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  nav button b{display:block;font-size:17px;margin-bottom:2px;font-weight:600}
  nav button.on{color:var(--ink)}
  nav button.on b{color:var(--accent)}

  .wrap{padding:14px 14px 28px;max-width:720px;margin:0 auto}
  h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    margin:20px 0 9px;font-weight:600}
  h2:first-child{margin-top:4px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;margin-bottom:9px}
  .card h3{margin:0 0 3px;font-size:15px;font-weight:600;line-height:1.3}
  .card p{margin:5px 0 0;color:var(--dim);font-size:13.5px}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);
    color:var(--dim);white-space:nowrap}
  .tag.ok{color:var(--ok);border-color:#1e4429}
  .tag.warn{color:var(--warn);border-color:#4a3a11}
  .tag.bad{color:var(--bad);border-color:#5a2222}
  .row{display:flex;gap:9px;font-size:13px;margin-top:6px}
  .row span:first-child{color:var(--faint);min-width:82px;flex-shrink:0}
  .blank{color:var(--bad);font-style:italic}

  .bar{position:absolute;z-index:500;left:9px;right:9px;top:9px;display:flex;gap:6px;
    pointer-events:none}
  .chip{pointer-events:auto;background:rgba(22,27,34,.94);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;font-size:12px;color:var(--dim);
    backdrop-filter:blur(8px)}
  .chip b{color:var(--ink);font-weight:600}
  .legend{position:absolute;z-index:500;left:9px;bottom:12px;background:rgba(22,27,34,.94);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;
    backdrop-filter:blur(8px)}
  .legend div{display:flex;align-items:center;gap:7px;margin:2px 0;color:var(--dim)}
  .legend i{width:9px;height:9px;border-radius:50%;display:block}
  .off{opacity:.32}
  .legend .shared i{width:15px;height:15px;font-size:9px;font-weight:600;color:#0d1117;
    display:flex;align-items:center;justify-content:center;background:var(--t4);
    box-shadow:0 0 0 1.5px rgba(230,237,243,.7)}

  /* Marker for a ground that more than one club plays on. The light ring
     is what tells it apart from an ordinary one-club circle. */
  .gpin{display:flex;align-items:center;justify-content:center;border-radius:50%;
    font-weight:600;font-size:11px;line-height:1;border:1.5px solid #0d1117;
    box-shadow:0 0 0 2px rgba(230,237,243,.7);cursor:pointer}
  .ground .gsub{color:var(--dim);font-size:12.5px;margin-top:2px}
  .ground .gclub{display:flex;align-items:center;gap:7px;width:100%;margin-top:6px;
    background:#1b2230;border:1px solid var(--line);border-radius:7px;padding:6px 8px;
    color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
  .ground .gclub i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .ground .gclub em{margin-left:auto;padding-left:9px;color:var(--faint);
    font-style:normal;font-size:11.5px;white-space:nowrap}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:10px}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
  .leaflet-popup-content{margin:11px 13px;font-size:13.5px}
  .leaflet-popup-content b{font-size:14.5px}
  .leaflet-container{background:#0a0e13;font-family:inherit}
  .leaflet-control-attribution{background:rgba(13,17,23,.85)!important;color:var(--faint)!important}
  .leaflet-control-attribution a{color:var(--dim)!important}

  /* Club detail sheet: pulls up from the bottom of the map and replaces
     the old popup. Capped at most of the screen so the map above stays
     visible and tappable, and scrolls inside itself. */
  .sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:74%;
    max-width:720px;margin:0 auto;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:14px 14px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.45);
    transform:translateY(0);transition:transform .22s ease}
  .sheet[hidden]{display:flex;transform:translateY(105%);visibility:hidden;
    transition:transform .22s ease,visibility 0s .22s}
  .sheet .grip{padding:7px 0 2px;display:flex;justify-content:center;cursor:grab;
    touch-action:none}
  .sheet .grip i{width:38px;height:4px;border-radius:3px;background:var(--line);display:block}
  .sheet .shead{display:flex;align-items:flex-start;gap:10px;padding:2px 14px 10px;
    border-bottom:1px solid var(--line);touch-action:none}
  .sheet .shead h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;flex:1;
    overflow-wrap:anywhere}
  .sheet .shead .meta{margin-top:6px}
  .sheet .x{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);
    font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;flex-shrink:0}
  .sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 14px calc(18px + env(safe-area-inset-bottom))}
  .sheet h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
    margin:16px 0 6px;font-weight:600}
  .sheet .row span:last-child{overflow-wrap:anywhere;min-width:0}
  .sheet .sub{color:var(--faint);font-size:12px;margin-top:2px}
  .sheet .unavail{color:var(--dim);font-size:13.5px;font-style:italic;margin:4px 0 0}
  .sheet .unavail b{font-style:normal;color:var(--warn);font-weight:600}
  .sheet a{color:var(--t3)}
  .fx{display:flex;gap:9px;align-items:baseline;font-size:13.5px;padding:6px 0;
    border-top:1px solid var(--line)}
  .fx:first-of-type{border-top:0}
  .fx .when{color:var(--dim);font-size:12.5px;min-width:98px;flex-shrink:0}
  .fx .when .notime{display:block;color:var(--faint);font-size:11.5px}
  .fx .who{flex:1;min-width:0;overflow-wrap:anywhere}
  .fx .who em{font-style:normal;color:var(--faint);font-size:11.5px;margin-right:5px}
  .fx .res{font-weight:600;white-space:nowrap}
  .fx .comp{display:block;color:var(--faint);font-size:11.5px}
  .sheet details{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:7px}
  .sheet summary{cursor:pointer;font-size:13.5px;color:var(--ink)}
  .sheet summary em{font-style:normal;color:var(--faint);font-size:12px}
  .sheet .item{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .sheet .item:first-of-type{border-top:0}
  .sheet .item .meta{margin-top:4px}
  .sheet .mates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sheet .mates button{display:flex;align-items:center;gap:6px;background:#1b2230;
    border:1px solid var(--line);border-radius:7px;padding:5px 8px;color:var(--ink);
    font:inherit;font-size:13px;cursor:pointer}
  .sheet .mates i{width:9px;height:9px;border-radius:50%}

  /* Route panel: the same pull-up shape as the club sheet, one layer
     below it, so a club opened from the route list sits on top and
     closing it comes back to the list. */
  .chip.btn{font:inherit;font-size:12px;cursor:pointer}
  .chip.btn.on{border-color:var(--t3);color:var(--ink)}
  /* Leaflet's control corners are z-index 1000; the club sheet sits above
     the route panel, and the tap-the-map bar above both. */
  .sheet.route{z-index:1000;max-height:62%}
  #sheet{z-index:1001}
  .route .pt{margin-top:10px}
  .route .pt label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--dim);margin-bottom:4px}
  .route .line{display:flex;gap:6px;flex-wrap:wrap}
  .route input[type=text]{flex:1 1 140px;min-width:0;background:#0d1117;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:16px}
  .route button.b{background:#1b2230;border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;cursor:pointer}
  .route button.b:disabled{opacity:.4;cursor:default}
  .route button.go{background:var(--t3);border-color:var(--t3);color:#0d1117;font-weight:600}
  .route .chosen{font-size:12.5px;color:var(--dim);margin-top:4px;overflow-wrap:anywhere}
  .route .chosen b{color:var(--ink);font-weight:500}
  .route .hits button{display:block;width:100%;text-align:left;margin-top:4px;
    background:#1b2230;border:1px solid var(--line);border-radius:7px;color:var(--ink);
    font:inherit;font-size:13px;padding:6px 8px;cursor:pointer}
  .route .ctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;margin-top:8px}
  .route .ctl input[type=range]{flex:1 1 140px;min-width:0}
  .route .ctl input[type=date]{background:#0d1117;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 7px;font:inherit;font-size:14px;color-scheme:dark}
  .rclub{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
    background:none;border:0;border-top:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:13.5px;padding:8px 0;cursor:pointer}
  .rclub i{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
  .rclub .rn{flex:1;min-width:0;overflow-wrap:anywhere}
  .rclub .rd{display:block;color:var(--faint);font-size:12px}
  .rclub .meta{margin-top:4px}
  .rclub .notime{color:var(--faint)}
  /* Derbies panel: the route panel's shape and layer. */
  .dclubs{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .dclub{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .dclub b{font-weight:600}
  .dclub .rd{display:block;color:var(--faint);font-size:12px}
  .dclub button{margin-top:6px}
  .dback{margin-top:8px}
  .pickbar[hidden]{display:none}
  .pickbar button{background:#1b2230;border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font:inherit;font-size:13px;padding:5px 10px;cursor:pointer}
  .pickbar{position:absolute;z-index:1002;left:9px;right:9px;bottom:14px;display:flex;
    gap:8px;align-items:center;justify-content:space-between;background:rgba(22,27,34,.96);
    border:1px solid var(--t3);border-radius:9px;padding:9px 11px;font-size:13.5px}

  .note{color:var(--faint);font-size:12.5px;margin:14px 0 0;line-height:1.5}

  /* Offline: the data banner, and the map's "needs a connection" card. */
  .offline{background:#3a2a06;color:#f2d38a;border-bottom:1px solid #6b4f12;
    padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
    font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:center}
  .offline[hidden]{display:none}
  .offline span{flex:1}
  .offline button{background:#1b2230;border:1px solid #6b4f12;border-radius:7px;
    color:var(--ink);font:inherit;font-size:12.5px;padding:5px 10px}
  .mapoff{position:absolute;z-index:450;left:50%;top:56px;transform:translateX(-50%);
    width:min(330px,calc(100% - 32px));background:rgba(22,27,34,.97);border:1px solid var(--warn);
    border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.45;pointer-events:none}
  .mapoff b{display:block;color:var(--warn);font-size:15px;margin-bottom:3px}
  .err{color:var(--bad);font-size:13px;margin:8px 0}
</style>
</head>
<body>
<div id="app">
  <div class="offline" id="offlineBanner" hidden role="status"><span id="offlineText"></span>
    <button id="offlineReload">Reload</button></div>
  <div id="panes">
    <div class="pane on" id="pane-map">
      <div id="map"></div>
      <div class="mapoff" id="mapOffline" hidden role="status"><b>The map needs a connection</b>
        <span id="mapOfflineWhy"></span></div>
      <div class="bar">
        <div class="chip" id="zoomChip">…</div>
        <div class="chip" id="homeChip">home not set</div>
        <button class="chip btn" id="routeChip" style="margin-left:auto">Route</button>
        <button class="chip btn" id="derbyChip">Derbies</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-label="Club details">
        <div class="grip"><i></i></div>
        <div class="shead"><div style="flex:1;min-width:0" id="sheetHead"></div>
          <button class="x" id="sheetClose" aria-label="Close">Close</button></div>
        <div class="sbody" id="sheetBody"></div>
      </div>
      <div class="sheet route" id="routePanel" hidden role="dialog" aria-label="Route">
        <div class="shead"><h3>Clubs along a route</h3>
          <button class="x" id="routeClose" aria-label="Close">Close</button></div>
        <div class="sbody" id="routeBody">
          <div class="pt" data-end="from"><label>Start</label>
            <div class="line"><input type="text" placeholder="Type a place" autocomplete="off">
              <button class="b" data-act="find">Find</button>
              <button class="b" data-act="tap">Tap map</button>
              <button class="b" data-act="home">Home</button></div>
            <div class="hits"></div><div class="chosen">not set</div></div>
          <div class="pt" data-end="to"><label>End</label>
            <div class="line"><input type="text" placeholder="Type a place" autocomplete="off">
              <button class="b" data-act="find">Find</button>
              <button class="b" data-act="tap">Tap map</button>
              <button class="b" data-act="home">Home</button></div>
            <div class="hits"></div><div class="chosen">not set</div></div>
          <div class="ctl"><button class="b go" id="routeGo" disabled>Get route</button>
            <button class="b" id="routeClear">Clear</button></div>
          <div class="sub">Each route asks Stadia Maps once (20 credits), and each place typed and
            found costs 20 more. Tapping the map or using home costs nothing.</div>
          <div id="routeOut"></div>
        </div>
      </div>
      <div class="sheet route" id="derbyPanel" hidden role="dialog" aria-label="Derbies">
        <div class="shead"><h3 id="derbyTitle">Derbies near home</h3>
          <button class="x" id="derbyClose" aria-label="Close">Close</button></div>
        <div class="sbody" id="derbyBody"></div>
      </div>
      <div class="pickbar" id="pickBar" hidden><span id="pickText">Tap the map</span>
        <button id="pickCancel">Cancel</button></div>
    </div>
    <div class="pane" id="pane-bucket"><div class="wrap" id="bucketBody"></div></div>
    <div class="pane" id="pane-tickets"><div class="wrap" id="ticketBody"></div></div>
  </div>
  <nav>
    <button class="on" data-pane="map"><b>◉</b>Map</button>
    <button data-pane="bucket"><b>★</b>Bucket list</button>
    <button data-pane="tickets"><b>▤</b>Ticket info</button>
  </nav>
</div>

<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script>
/* ------------------------------------------------------------------
   Football planner.
   Reads the files the GitHub Actions workflows commit. Computes nothing
   it cannot derive from them: a field that is missing in the data is
   shown as "not recorded" rather than filled in with a guess.
------------------------------------------------------------------- */

const TIER_COLOUR = {
  1:'#e8543f', 2:'#e8a33f', 3:'#3fa0e8', 4:'#2aab8e', 5:'#4caf50',
  6:'#9b6bd6', 7:'#e8629f', 8:'#825e35'
};
const TIER_NAME = {
  1:'Tier 1', 2:'Tier 2', 3:'Tier 3', 4:'Tier 4', 5:'Tier 5',
  6:'Tier 6', 7:'Tier 7', 8:'Tier 8'
};

/* Zoom at which each tier switches on. Tiers 1-3 each keep their own
   threshold, so the country view stays readable as you zoom in. Tier 4
   and every tier deeper than it share one threshold, DEEP_TIER_ZOOM -
   the zoom tier 4 used on its own before this merge. A separate
   threshold per tier tops out somewhere, and clubs have now turned up
   as deep as tier 8 (from europlan-online's league pages, which go well
   below the Regionalliga Wikidata tags them with); topping out either
   drops a deep club off the map or shows it at a false shallow tier.
   One shared band for "tier 4 or deeper" means a newly discovered
   tier 6, 7 or 8 club falls into the right band with no further code
   change here. */
const TIER_FROM_ZOOM = {1:0, 2:7, 3:9};
const DEEP_TIER_ZOOM = 11;
function zoomForTier(tier){
  return TIER_FROM_ZOOM[tier] ?? (tier >= 4 ? DEEP_TIER_ZOOM : undefined);
}

const COUNTRY_FILES = ['data/clubs/DE.json','data/clubs/RO.json','data/clubs/FR.json','data/clubs/IT.json','data/clubs/CH.json','data/clubs/AT.json','data/clubs/RS.json','data/clubs/GR.json','data/clubs/ES.json','data/clubs/GB.json','data/clubs/NL.json','data/clubs/BE.json'];

/* Fallback only. The real value comes from settings.home in
   football-rules.json once you fill in its lat/lon. */
const HOME_FALLBACK = {label:'Leonberg, DE (default)', lat:48.8003, lon:9.0167};

let MAP, LAYER, CLUBS = [], HOME = null, MULTIPLIER = 1.25;

/* Stadia Maps key: map tiles, and since 2026-10-02 the route request and
   the place search on the map tab. It sits in the page on purpose - see
   CLAUDE.md, Secrets. Changing or rotating it is this one line. */
const STADIA_KEY = 'ec818681-51dd-4ceb-89c0-6f1124dbc053';

/* ----------------------------------------------------------- helpers */

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function haversine(a, b, c, d){
  const R = 6371, r = Math.PI/180;
  const dLat = (c-a)*r, dLon = (d-b)*r;
  const x = Math.sin(dLat/2)**2 +
            Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* Straight line times the multiplier from settings. No routing API, so
   this is a road-distance estimate and nothing more - it is not a
   travel time and is not turned into one. */
function roadEstimate(lat, lon){
  if(!HOME || lat == null || lon == null) return null;
  return Math.round(haversine(HOME.lat, HOME.lon, lat, lon) * MULTIPLIER);
}

function field(label, value){
  const v = (value === null || value === undefined || value === '')
    ? '<span class="blank">not recorded</span>' : esc(value);
  return `<div class="row"><span>${esc(label)}</span><span>${v}</span></div>`;
}

function sourceTag(src){
  if(src === 'confirmed') return '<span class="tag ok">confirmed</span>';
  if(src === 'inferred')  return '<span class="tag warn">estimated date</span>';
  if(src === 'disputed')  return '<span class="tag bad">disputed — do not trust</span>';
  return '<span class="tag bad">no date source</span>';
}

async function getJSON(path){
  const direct = !navigator.serviceWorker?.controller;   // before the request: who will answer it
  const res = await fetch(path, {cache:'no-cache'});
  noteSource(path, res, direct);
  if(!res.ok) throw new Error(path + ' → ' + res.status + (res.statusText ? ' ' + res.statusText : ''));
  return res.json();
}

/* ----------------------------------------------- offline (installed app)

   sw.js answers a data file from its saved copy ONLY when the network
   fails, and marks that answer with x-served-from: cache and the time
   the copy was saved. Every such answer puts the banner up with the
   OLDEST saved time among them, so old data never looks current. */

const FROM_CACHE = new Map();       // path -> saved-at (ISO), or '' if unknown
const NOT_SAVED = new Set();        // offline, and never saved on this device
const UNSAVED = new Set();          // loaded before the worker was in charge

function noteSource(path, res, direct){
  const from = res.headers.get('x-served-from');
  if(from === 'cache'){
    FROM_CACHE.set(path, res.headers.get('x-saved-at') || '');
    showOfflineBanner();
  }else if(from === 'none'){
    NOT_SAVED.add(path);
    showOfflineBanner();
  }else if(res.ok && direct && 'serviceWorker' in navigator){
    UNSAVED.add(new URL(path, location.href).href);
    saveForOffline();
  }
}

function showOfflineBanner(){
  const times = [...FROM_CACHE.values()];
  const known = times.filter(Boolean).sort();
  const when = known.length
    ? new Date(known[0]).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short',
        year:'numeric', hour:'2-digit', minute:'2-digit'})
    : 'an unknown date';
  /* A file the device never saved is named, not silently left out. */
  const missing = [...NOT_SAVED].map(p => p.replace(/^data\//, ''));
  document.getElementById('offlineText').textContent =
    (times.length
      ? `Offline. Showing data saved on ${when}` +
        (known.length && known.length < times.length ? ' or earlier' : '') + '. It may be out of date.'
      : 'Offline.') +
    (missing.length ? ` Never saved on this device, so missing: ${missing.join(', ')}.` : '');
  document.getElementById('offlineBanner').hidden = false;
  if(MAP) setTimeout(() => MAP.invalidateSize(), 0);
}

let SAVE_TIMER = null;
function saveForOffline(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(async () => {
    try{
      const reg = await navigator.serviceWorker.ready;
      const urls = [...UNSAVED]; UNSAVED.clear();
      if(urls.length && reg.active) reg.active.postMessage({type:'save-data', urls});
    }catch(err){ console.warn('could not save data for offline use:', err.message); }
  }, 500);
}

/* --------------------------------------------------------------- map */

function buildLegend(){
  document.getElementById('legend').innerHTML =
    Object.keys(TIER_COLOUR).map(t =>
      `<div data-tier="${t}"><i style="background:${TIER_COLOUR[t]}"></i>${TIER_NAME[t]}</div>`
    ).join('') +
    '<div class="shared"><i>2</i>Shared ground &mdash; tap for the list</div>';
}

function radiusFor(tier, zoom){
  const base = {1:7,2:6,3:5,4:4,5:3.5,6:3,7:3,8:3}[tier] || 3;
  return zoom >= 10 ? base + 1.5 : base;
}

/* Dark or light text on a tier colour, from the colour itself, so a new
   tier colour cannot end up with a digit nobody can read. */
function inkOn(hex){
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299*(n >> 16 & 255) + 0.587*(n >> 8 & 255) + 0.114*(n & 255)) / 255;
  return lum > 0.45 ? '#0d1117' : '#f0f4f8';
}

/* bubblingMouseEvents is off so that tapping a circle does not also
   count as tapping the map, which closes the sheet it just opened. */
function soloMarker(club, zoom){
  return L.circleMarker([club.lat, club.lon], {
    radius: radiusFor(club.tier, zoom),
    color: '#0d1117', weight: 1.5,
    fillColor: TIER_COLOUR[club.tier] || '#888', fillOpacity: .95,
    bubblingMouseEvents: false
  }).on('click', () => PICKING ? pickPoint(club.lat, club.lon, club.name || club.id) : openSheet(club));
}

/* One marker for one ground, carrying the number of clubs on it. Tapping
   it lists them; tapping a name opens that club's own sheet, which lists
   the other clubs here so there is always a way across to them. Nothing
   is merged: the list is a way in to each club, not a club made out of
   several. */
function groundMarker(clubs, zoom){
  const top   = Math.min(...clubs.map(c => c.tier));
  const fill  = TIER_COLOUR[top] || '#888';
  const size  = Math.max(20, Math.round(radiusFor(top, zoom) * 2 + 5));
  const names = clubs.map(c => c.name || c.id);

  const marker = L.marker([clubs[0].lat, clubs[0].lon], {
    title: `${clubs.length} clubs: ${names.join(', ')}`,
    icon: L.divIcon({
      className: '',
      html: `<div class="gpin" style="width:${size}px;height:${size}px;` +
            `background:${fill};color:${inkOn(fill)}">${clubs.length}</div>`,
      iconSize:    [size, size],
      iconAnchor:  [size/2, size/2],
      popupAnchor: [0, -size/2]
    })
  });

  /* Only a venue name every club here agrees on is shown once at the top.
     If the items disagree, no shared name is invented - each club's own
     sheet still carries its own. */
  const venues = [...new Set(clubs.map(c => c.venue).filter(Boolean))];
  const km = roadEstimate(clubs[0].lat, clubs[0].lon);

  const box = document.createElement('div');
  box.className = 'ground';
  box.innerHTML =
    `<b>${clubs.length} clubs at this ground</b>` +
    (venues.length === 1 ? `<div class="gsub">${esc(venues[0])}</div>` : '') +
    (km !== null ? `<div class="gsub">≈ ${km} km from ${esc(HOME.label)}</div>` : '') +
    clubs.map((c, i) =>
      `<button class="gclub" data-i="${i}">` +
      `<i style="background:${TIER_COLOUR[c.tier] || '#888'}"></i>` +
      `<span>${esc(c.name || c.id)}</span>` +
      `<em>${TIER_NAME[c.tier]}</em></button>`).join('');
  box.addEventListener('click', ev => {
    const pick = ev.target.closest('.gclub');
    if(!pick) return;
    MAP.closePopup();
    openSheet(clubs[Number(pick.dataset.i)], clubs);
  });

  return marker.bindPopup(box);
}

/* Two clubs on one coordinate used to be two markers on one pixel, and
   the second one drawn covered the first completely - the club
   underneath was in the data but could not be seen or clicked. Clubs are
   grouped by coordinate before anything is drawn, and a coordinate with
   more than one club gets a single marker that says how many.

   Grouping is on the exact coordinate. Two clubs a few metres apart stay
   two markers: this rescues clubs that would otherwise be unreachable,
   it is not a clustering system for the map as a whole.

   The tier/zoom filter runs first and grouping second, so the zoom rule
   keeps meaning what it always meant - a club is drawn once its tier's
   zoom is reached, and never before. A shared marker therefore lists
   exactly the clubs visible at the current zoom, and its number is how
   many those are. The Fritz-Walter-Stadion is a plain 1. FC
   Kaiserslautern marker from z7 and turns into a "2" at z11, when the
   reserve team's tier switches on. */
function drawClubs(){
  const zoom = MAP.getZoom();
  LAYER.clearLayers();

  const points = new Map();
  for(const club of CLUBS){
    const from = zoomForTier(club.tier);
    if(from === undefined || zoom < from) continue;
    const key = club.lat + ',' + club.lon;
    if(!points.has(key)) points.set(key, []);
    points.get(key).push(club);
  }

  let shown = 0, shared = 0;
  for(const clubs of points.values()){
    shown += clubs.length;
    if(clubs.length === 1){
      soloMarker(clubs[0], zoom).addTo(LAYER);
    }else{
      shared++;
      clubs.sort((a, b) => a.tier - b.tier ||
        String(a.name || a.id).localeCompare(String(b.name || b.id)));
      groundMarker(clubs, zoom).addTo(LAYER);
    }
  }

  document.getElementById('zoomChip').innerHTML =
    `<b>${shown}</b> clubs · z${zoom}` +
    (shared ? ` · <b>${shared}</b> shared ground${shared === 1 ? '' : 's'}` : '');

  document.querySelectorAll('#legend div[data-tier]').forEach(el => {
    const t = Number(el.dataset.tier);
    el.classList.toggle('off', zoom < zoomForTier(t));
  });
  document.querySelector('#legend .shared')?.classList.toggle('off', !shared);
}

async function initMap(){
  MAP = L.map('map', {zoomControl:false, attributionControl:true})
         .setView([48.80, 9.02], 8);
  L.control.zoom({position:'bottomright'}).addTo(MAP);

  /* Tiles are never cached by sw.js (CLAUDE.md, The installable app).
     Offline, or when tiles keep failing, a card says the map needs a
     connection rather than leaving a blank square. */
  const tiles = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png?api_key=' + STADIA_KEY, {
    maxZoom: 20,
    attribution: '&copy; <a href="https://stadiamaps.com/attribution/" target="_blank">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }).addTo(MAP);
  let tileFails = 0;
  const mapNet = () => {
    const offline = navigator.onLine === false;
    document.getElementById('mapOfflineWhy').textContent = offline
      ? 'This phone is offline, and map tiles are never saved. Club markers, the bucket list and ticket info still work from saved data.'
      : 'Map tiles are not loading: no connection, or Stadia Maps refused them. Club markers still work.';
    document.getElementById('mapOffline').hidden = !(offline || tileFails >= 4);
  };
  tiles.on('tileload', () => { if(tileFails){ tileFails = 0; mapNet(); } });
  tiles.on('tileerror', () => { tileFails++; mapNet(); });
  addEventListener('offline', mapNet);
  addEventListener('online', () => { tileFails = 0; mapNet(); tiles.redraw(); });
  mapNet();

  /* Canvas rendering: DOM markers start to stutter on a phone at a
     couple of thousand, canvas does not. */
  LAYER = L.layerGroup([], {renderer: L.canvas({padding:.5})}).addTo(MAP);

  buildLegend();
  MAP.on('zoomend', drawClubs);
  MAP.on('click', ev => PICKING ? pickPoint(ev.latlng.lat, ev.latlng.lng) : closeSheet());
  ROUTE_LAYER = L.layerGroup().addTo(MAP);

  const loaded = [];
  for(const path of COUNTRY_FILES){
    try{
      const data = await getJSON(path);
      for(const club of data.clubs || []){
        club.country = data.country;
        /* Both halves of the coordinate. A club whose position was
           cleared by hand in clubs-manual.csv arrives with lat and lon
           null and must not be drawn at all - not at 0,0, not at a
           half-coordinate, not anywhere. */
        if(club.lat != null && club.lon != null && club.tier != null) CLUBS.push(club);
      }
      loaded.push(path);
    }catch(err){
      console.warn('club file missing:', path, err.message);
    }
  }
  if(!CLUBS.length){
    document.getElementById('zoomChip').innerHTML =
      '<b>no clubs</b> — run Build club layer';
  }
  drawClubs();
}

/* ------------------------------------------------ club detail sheet */

/* Tapping a club opens this sheet. Everything in its top block is in the
   club file already. Fixtures and ticket info are joined to the club by
   files built for the purpose, never by matching names here:

   - fixtures through data/clubs/fixture-links.json, which
     tools/link_fixtures.py writes and reports on. A club it did not link
     confidently is not in that file, and the sheet says fixtures are
     unavailable rather than guessing a team by its name.
   - ticket info through the clubQid column the ticket files already
     carry, which is an exact join. A club with no row says so.

   Each section fetches its files the first time a sheet needs them and
   keeps them for the rest of the visit. */

const LOADS = {};
function loadOnce(key, fn){
  if(!LOADS[key]) LOADS[key] = fn().then(v => ({ok:true, v}), err => ({ok:false, err:err.message}));
  return LOADS[key];
}

async function getText(path){
  const direct = !navigator.serviceWorker?.controller;   // before the request: who will answer it
  const res = await fetch(path, {cache:'no-cache'});
  noteSource(path, res, direct);
  if(!res.ok) throw new Error(path + ' → ' + res.status + (res.statusText ? ' ' + res.statusText : ''));
  return res.text();
}

/* A plain CSV reader: quoted cells, doubled quotes inside them, commas
   and line breaks inside quotes. The hand-written files quote any cell
   holding a comma, so this is the whole grammar they use. */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if(ch === '"') q = false;
      else cell += ch;
    }else if(ch === '"') q = true;
    else if(ch === ',') { row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    }else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(c => c.trim() !== ''))
             .map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
}

const csvFile  = path => loadOnce(path, async () => parseCSV(await getText(path)));
const jsonFile = path => loadOnce(path, () => getJSON(path));

/* The competition a club plays in, by name. Worked out from the club's
   own league tags and data/league-tiers.csv rather than trusted from the
   club file's "competition" field, because that field used to fall back
   to the FIRST league mapped at a club's tier - which put Wacker
   Burghausen and Hallescher FC in the Regionalliga Suedwest. A name is
   given only when it is the club's own tag at its tier, or when the
   country maps exactly one league at that tier. Otherwise it is left
   blank and the sheet says why. */
function competitionOf(club, tiers){
  const leagues = tiers.filter(l => String(l.tier) === String(club.tier));
  const own = leagues.filter(l => (club.leagues || []).includes(l.leagueQid));
  if(own.length === 1) return {name: own[0].label};
  const here = leagues.filter(l => l.country === club.country);
  if(!own.length && here.length === 1)
    return {name: here[0].label,
            how: "the only league mapped at this tier; the club's own Wikidata tag names a different one"};
  if(own.length > 1) return {why: `its tags name ${own.length} leagues at this tier`};
  if(here.length > 1)
    return {why: `${here.length} leagues are mapped at tier ${club.tier} and nothing on the club says which`};
  return {why: `no league at tier ${club.tier} is mapped in data/league-tiers.csv`};
}

let SHEET_FOR = null;          // the club the sheet is showing

function closeSheet(){
  document.getElementById('sheet').hidden = true;
  SHEET_FOR = null;
}

function unavailable(what, why){
  return `<p class="unavail"><b>${esc(what)} unavailable.</b> ${why}</p>`;
}

function openSheet(club, mates){
  SHEET_FOR = club.id;
  const colour = TIER_COLOUR[club.tier] || '#888';
  document.getElementById('sheetHead').innerHTML =
    `<h3>${esc(club.name || club.id)}</h3>` +
    `<div class="meta">` +
      `<span class="tag" style="color:${colour};border-color:${colour}55">${esc(TIER_NAME[club.tier] || 'tier ' + club.tier)}</span>` +
      `<span class="tag">${esc(club.country || '')}</span>` +
      (club.manual ? '<span class="tag warn">hand-corrected</span>' : '') +
    `</div>`;

  const km = roadEstimate(club.lat, club.lon);
  const others = (mates || []).filter(c => c.id !== club.id);
  document.getElementById('sheetBody').innerHTML =
    `<h4>Club</h4>` +
    field('Ground', club.venue) +
    field('Capacity', club.capacity ? club.capacity.toLocaleString('en-GB') : null) +
    `<div id="sheetComp">${field('Competition', '…')}</div>` +
    field('Distance', km !== null ? `≈ ${km} km by road (estimate) from ${HOME.label}` : null) +
    `<div class="sub">Straight line × ${MULTIPLIER}. Not a travel time.
      <a href="https://www.wikidata.org/wiki/${esc(club.id)}" target="_blank" rel="noopener">${esc(club.id)}</a></div>` +
    (others.length ? `<h4>Also at this ground</h4><div class="mates">` +
      others.map(c => `<button data-id="${esc(c.id)}"><i style="background:${TIER_COLOUR[c.tier] || '#888'}"></i>${esc(c.name || c.id)}</button>`).join('') +
      `</div>` : '') +
    `<h4>Fixtures</h4><div id="sheetFix"><p class="unavail">Loading…</p></div>` +
    `<h4>Ticket info</h4><div id="sheetTix"><p class="unavail">Loading…</p></div>`;

  document.querySelectorAll('#sheetBody .mates button').forEach(b =>
    b.addEventListener('click', () =>
      openSheet(mates.find(c => c.id === b.dataset.id), mates)));

  const sheet = document.getElementById('sheet');
  sheet.hidden = false;
  sheet.querySelector('.sbody').scrollTop = 0;

  /* Keep the club's own marker in sight above the sheet. */
  const pt = MAP.latLngToContainerPoint([club.lat, club.lon]);
  const open = MAP.getSize().y - sheet.offsetHeight;
  if(pt.y > open - 30) MAP.panBy([0, pt.y - open / 2], {animate: true});

  const fill = (id, html) => {
    if(SHEET_FOR !== club.id) return;   // the sheet has moved on to another club
    document.getElementById(id).innerHTML = html;
  };
  competitionHtml(club).then(h => fill('sheetComp', h));
  fixturesHtml(club).then(h => fill('sheetFix', h));
  ticketsHtml(club).then(h => fill('sheetTix', h));
}

async function competitionHtml(club){
  const t = await csvFile('data/league-tiers.csv');
  if(!t.ok) return field('Competition', null) +
    `<div class="sub">data/league-tiers.csv could not be loaded (${esc(t.err)}).</div>`;
  const c = competitionOf(club, t.v);
  if(c.name) return field('Competition', `${c.name} (tier ${club.tier})`) +
    (c.how ? `<div class="sub">${esc(c.how)}.</div>` : '');
  return `<div class="row"><span>Competition</span><span><span class="blank">not recorded</span>` +
    ` (tier ${esc(club.tier)})</span></div><div class="sub">${esc(c.why)}.</div>`;
}

/* ---- fixtures */

const FX_DATE = new Intl.DateTimeFormat('en-GB',
  {timeZone:'Europe/Berlin', weekday:'short', day:'numeric', month:'short'});
const FX_TIME = new Intl.DateTimeFormat('en-GB',
  {timeZone:'Europe/Berlin', hour:'2-digit', minute:'2-digit'});

/* football-data.org writes a match whose kickoff is not set yet as status
   SCHEDULED at 00:00 UTC - a placeholder, not a time. Confirmed times are
   TIMED. Midnight UTC alone is NOT the test: Brazilian 21:00 kickoffs are
   genuinely 00:00 UTC (FINISHED and TIMED rows in BSA and WC), so both the
   status and the midnight must agree. OpenLigaDB has no such status and
   leaves utcDate null when it has no time, which is already "date not set". */
const timeNotSet = m => m.status === 'SCHEDULED' && !!m.utcDate &&
  /T00:00:00(\.0+)?Z$/.test(m.utcDate);

function fxWhen(m){
  if(!m.utcDate) return 'date not set';
  const d = new Date(m.utcDate);
  const y = d.getUTCFullYear() !== new Date().getUTCFullYear() ? ' ' + d.getUTCFullYear() : '';
  if(timeNotSet(m)) return `${FX_DATE.format(d)}${y}<span class="notime">time not set</span>`;
  return `${FX_DATE.format(d)}${y} · ${FX_TIME.format(d)}`;
}

/* When the match is over for classification purposes. A placeholder midnight
   says nothing about the hour, so such a match counts as still ahead until
   its date has passed - otherwise one played later today reads as "no result". */
const fxEnd = m => m.utcDate ? new Date(m.utcDate).getTime() + (timeNotSet(m) ? 24*3600e3 : 0) : Infinity;

/* football-data.org says FINISHED; OpenLigaDB has only finished: true. */
const isFinished = m => m.status === 'FINISHED' || m.finished === true;

function fxRow(m, teamId){
  const home = String(m.home?.id) === teamId;
  const opp  = home ? m.away : m.home;
  const score = isFinished(m) && m.homeGoals != null
    ? `<span class="res">${home ? m.homeGoals : m.awayGoals}–${home ? m.awayGoals : m.homeGoals}</span>` : '';
  const odd = m.status && !['SCHEDULED','TIMED','FINISHED'].includes(m.status)
    ? ` <span class="tag warn">${esc(m.status.toLowerCase())}</span>` : '';
  const noResult = !isFinished(m) && m.utcDate && fxEnd(m) < Date.now()
    ? ' <span class="tag">no result recorded</span>' : '';
  return `<div class="fx"><span class="when">${fxWhen(m)}</span>` +
    `<span class="who"><em>${home ? 'H' : 'A'}</em>${home ? 'v' : 'at'} ${esc(opp?.name || 'opponent not set')}${odd}${noResult}` +
    `<span class="comp">${esc(m._comp)}</span></span>${score}</div>`;
}

async function fixturesHtml(club){
  const links = await jsonFile('data/clubs/fixture-links.json');
  if(!links.ok) return unavailable('Fixtures',
    `The link file data/clubs/fixture-links.json could not be loaded (${esc(links.err)}).`);
  const entry = links.v.clubs?.[club.id];
  if(!entry){
    const held = links.v.notLinked?.[club.id];
    if(held) return unavailable('Fixtures', esc(held));
    return unavailable('Fixtures', club.country === 'RO'
      ? "football-data.org's free tier carries no Romanian competition and OpenLigaDB is German only."
      : club.country === 'FR' && club.tier >= 2
      ? "football-data.org's free tier carries Ligue 1 only, not Ligue 2, and OpenLigaDB is German only."
      : club.country === 'IT' && club.tier >= 2
      ? "football-data.org's free tier carries Serie A only, not Serie B, and OpenLigaDB is German only."
      : club.country === 'CH'
      ? "football-data.org's free tier carries no Swiss competition and OpenLigaDB is German only."
      : club.country === 'AT'
      ? "football-data.org's free tier carries no Austrian competition and OpenLigaDB is German only."
      : club.country === 'RS'
      ? "football-data.org's free tier carries no Serbian competition and OpenLigaDB is German only."
      : club.country === 'GR'
      ? "football-data.org's free tier carries no Greek competition and OpenLigaDB is German only."
      : club.country === 'ES' && club.tier >= 2
      ? "football-data.org's free tier carries La Liga only, not the Segunda División, and OpenLigaDB is German only."
      : club.country === 'NL' && club.tier >= 2
      ? "football-data.org's free tier carries the Eredivisie only, not the Eerste Divisie, and OpenLigaDB is German only."
      : club.country === 'BE'
      ? "football-data.org's free tier carries no Belgian league - a team seen only in the Champions League is never linked by name, because nothing there says which country it is from - and OpenLigaDB is German only."
      : club.tier >= 5
      ? "No fixture source this project fetches goes below the Regionalliga."
      : club.tier === 4
      ? "OpenLigaDB carries the Regionalliga Nord and Nordost only - not Bayern, Südwest or " +
        "West - and no team in either matched this club's name with confidence."
      : "No team in the fixture files matched this club's name with confidence. " +
        "See data/clubs/fixture-link-review.csv.");
  }

  const matches = [], failed = [], seen = new Set();
  for(const link of entry.links){
    for(const comp of link.competitions){
      const f = await jsonFile(comp.file);
      if(!f.ok){ failed.push(comp.label); continue; }
      for(const m of f.v.matches || []){
        const key = link.source + ':' + m.id;
        if(seen.has(key)) continue;
        if(String(m.home?.id) === link.teamId || String(m.away?.id) === link.teamId){
          seen.add(key);
          matches.push(Object.assign({_comp: comp.label, _team: link.teamId}, m));
        }
      }
    }
  }

  const now = Date.now() - 3*3600e3;   // a match that kicked off within 3h is still "next"
  const time = m => m.utcDate ? new Date(m.utcDate).getTime() : Infinity;
  const ahead = matches.filter(m => !isFinished(m) && fxEnd(m) >= now)
                       .sort((a, b) => time(a) - time(b));
  const past  = matches.filter(m => isFinished(m) || fxEnd(m) < now)
                       .sort((a, b) => time(b) - time(a));

  const sources = entry.links.map(l =>
    `${l.source === 'football-data' ? 'football-data.org' : 'OpenLigaDB'} ` +
    `(${l.competitions.map(c => c.label).join(', ')})` +
    (l.basis === 'manual' ? ', linked by hand' : '') +
    (l.basis.includes('venue') ? ', name and venue' : '')).join(' · ');

  let html = '';
  if(ahead.length) html += ahead.slice(0, 6).map(m => fxRow(m, m._team)).join('') +
    (ahead.length > 6 ? `<div class="sub">${ahead.length - 6} more ahead.</div>` : '');
  else html += `<p class="unavail">No match ahead in the fetched files.</p>`;
  if(past.length) html += `<details><summary>Recent <em>— ${past.length} played</em></summary>` +
    past.slice(0, 5).map(m => fxRow(m, m._team)).join('') + `</details>`;
  if(failed.length) html += `<p class="err">Could not load: ${esc(failed.join(', '))}.</p>`;
  html += `<div class="sub">Times are German time. From ${esc(sources)}. Fetched data - it feeds
    the app, never the calendars.</div>`;
  return html;
}

/* ---- ticket info */

const words = v => (v || '').split(';').map(x => x.trim()).filter(Boolean).join(', ');

function confTag(v){
  if(v === 'confirmed')  return '<span class="tag ok">confirmed</span>';
  if(v === 'inferred')   return '<span class="tag warn">inferred</span>';
  if(v === 'unverified') return '<span class="tag bad">unverified</span>';
  return v ? `<span class="tag">${esc(v)}</span>` : '';
}

function scopeTag(r, names){
  if(!r.scope || r.scope === 'general') return '';
  const opp = r.opponentQid ? (names[r.opponentQid] || r.opponentQid) : '';
  return `<span class="tag">${esc(r.scope)}${opp ? ' v ' + esc(opp) : ''}</span>`;
}

async function ticketsHtml(club){
  const base = await csvFile('data/club-tickets.csv');
  if(!base.ok) return unavailable('Ticket info',
    `data/club-tickets.csv could not be loaded (${esc(base.err)}).`);
  const row = base.v.find(r => r.clubQid === club.id && r.team === 'men');
  if(!row) return unavailable('Ticket info',
    'data/club-tickets.csv has no row for this club. That is the ordinary state: only a ' +
    'few clubs have been researched.');

  const [win, rules, demand, prices, national] = await Promise.all([
    csvFile('data/club-ticket-windows.csv'), csvFile('data/club-ticket-rules.csv'),
    csvFile('data/club-ticket-demand.csv'),  csvFile('data/club-ticket-prices.csv'),
    csvFile('data/country-ticket-rules.csv')]);
  const mine = f => f.ok ? f.v.filter(r => r.clubQid === club.id && (r.team || 'men') === 'men') : null;

  /* Opponent names for derby rows, from the ticket file itself. */
  const names = Object.fromEntries(base.v.map(r => [r.clubQid, r.club]));
  CLUBS.forEach(c => names[c.id] ??= c.name);

  const warn = [];
  if(row.country && row.country !== club.country)
    warn.push(`club-tickets.csv says ${row.country}, the map file says ${club.country}.`);

  let h =
    (row.ticketUrl ? `<div class="row"><span>Ticket page</span><span><a href="${esc(row.ticketUrl)}" target="_blank" rel="noopener">${esc(row.ticketUrl)}</a></span></div>` : field('Ticket page', null)) +
    field('Who may buy', words(row.access)) +
    field('How it sells', words(row.salesModel)) +
    (row.requestTypes ? field('Requests for', words(row.requestTypes)) : '') +
    field('Deadline', {stated:'the club states one', none:'the club states none',
                       unknown:'not known whether there is one'}[row.cutoff] || row.cutoff) +
    field('Closes early', words(row.closesEarly)) +
    field('Demand', words(row.demand)) +
    field('Resale', words(row.resale)) +
    field('Under-18s', words(row.minorEligibility)) +
    field('Announced via', words(row.updateTracking)) +
    field('Checked', row.checked) +
    warn.map(w => `<p class="err">${esc(w)}</p>`).join('');

  const section = (title, list, render, empty) => {
    if(list === null) return `<p class="err">${esc(title)}: file could not be loaded.</p>`;
    if(!list.length) return empty ? `<div class="sub">${esc(empty)}</div>` : '';
    return `<details><summary>${esc(title)} <em>— ${list.length}</em></summary>` +
      list.map(render).join('') + `</details>`;
  };

  h += section('Sales windows', mine(win), r =>
    `<div class="item"><b>${esc(r.label || r.window)}</b>` +
    (r.opensEstimate ? ` — opens ${esc(r.opensEstimate)}${r.estimateFor ? ' (' + esc(r.estimateFor) + ')' : ''}` : '') +
    (r.pastCycle ? `<div class="sub">past cycle: ${esc(r.pastCycle)}</div>` : '') +
    `<div class="meta">${sourceTag(r.dateSource)}${r.basis ? `<span class="tag">${esc(r.basis)}</span>` : ''}${scopeTag(r, names)}</div></div>`,
    'No sales-window rows.');

  h += section('Rules', mine(rules), r =>
    `<div class="item"><b>${esc(r.topic)}</b>${r.season ? ' · ' + esc(r.season) : ''}` +
    `<div>${esc(r.rule)}</div><div class="meta">${confTag(r.confidence)}${scopeTag(r, names)}</div></div>`);

  const country = row.country || club.country;
  const nat = national.ok ? national.v.filter(r => r.country === country) : null;
  h += section(`National rules [${country}]`, nat, r =>
    `<div class="item"><b>${esc(r.topic)}</b> · ${esc(r.authority)}` +
    `<div>${esc(r.rule)}</div>` +
    `<div class="sub">applies to: ${esc(words(r.appliesTo))} · when: ${esc(words(r.condition))} · club latitude: ${esc(r.clubLatitude)}</div>` +
    `<div class="meta">${confTag(r.confidence)}</div></div>`,
    `No national rows for ${country} in data/country-ticket-rules.csv.`);

  h += section('Sell-out record', mine(demand), r =>
    `<div class="item"><b>${esc(r.season)}</b> ${scopeTag(r, names)} ${esc(r.outcome)}` +
    (r.timing ? ` — ${esc(r.timing)}` : '') + (r.attendance ? ` · ${esc(r.attendance)}` : '') +
    `<div class="meta">${confTag(r.confidence)}</div></div>`);

  h += section('Prices', mine(prices), r =>
    `<div class="item">${esc(r.season)} · ${esc(r.competition)}${r.stage ? ' · ' + esc(r.stage) : ''}` +
    ` · ${esc(r.category)}${r.opponentTier ? ' · ' + esc(r.opponentTier) : ''}${r.priceClass ? ' · ' + esc(r.priceClass) : ''}: ` +
    `<b>${esc(r.price)}${r.priceMax ? '–' + esc(r.priceMax) : ''} ${esc(r.currency)}</b>` +
    `<div class="meta"><span class="tag${r.kind === 'resale-observed' ? ' warn' : ''}">${esc(r.kind)}</span>` +
    `${r.priceBasis ? `<span class="tag">${esc(r.priceBasis)}</span>` : ''}${confTag(r.confidence)}${scopeTag(r, names)}</div></div>`);

  h += `<div class="sub">Hand-written in data/club-tickets.csv and the ticket files beside it,
    joined to this club by its Wikidata id. Nothing here is generated, and no sale date is.</div>`;
  return h;
}

(function wireSheet(){
  const sheet = document.getElementById('sheet');
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

  /* Drag the handle or the title down to close. */
  let y0 = null;
  const grab = sheet.querySelectorAll('.grip, .shead');
  grab.forEach(el => el.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    y0 = e.clientY; sheet.style.transition = 'none';
    el.setPointerCapture(e.pointerId);
  }));
  grab.forEach(el => el.addEventListener('pointermove', e => {
    if(y0 === null) return;
    sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`;
  }));
  const drop = e => {
    if(y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    sheet.style.transition = ''; sheet.style.transform = '';
    if(dy > 70) closeSheet();
  };
  grab.forEach(el => { el.addEventListener('pointerup', drop); el.addEventListener('pointercancel', drop); });
})();

/* ------------------------------------------------------------- route */

/* Clubs along a road route. One request to Stadia Maps' routing API for
   the road line; everything after that - which clubs are near it, how
   far, in what order, which play at home on a date - is worked out here
   from the line itself and the files already in the repo, so moving the
   distance slider or changing the date costs nothing.

   A typed place is found with Stadia's forward geocoding (one request,
   20 credits, coordinates included). Its autocomplete v2 is 1 credit but
   returns no coordinates, and fetching them is a further 20 per place,
   so it would cost more, not less. Tapping the map and the home location
   cost nothing. */

let ROUTE_LAYER = null, PICKING = null, ROUTE = null;
const ROUTE_ENDS = {from: null, to: null};      // {lat, lon, label}
const ROUTE_COLOUR = '#58a6ff';

/* Fixture competitions that are a LEAGUE: a club linked to one of these
   plays its regular home games in it, so a date the file spans with no
   home match for the club means no home match. Cups (CL, EC, WC, dfb)
   say nothing about the other days. A code not listed here is treated
   like a cup - the club is kept and marked, never hidden - so a
   competition added later cannot quietly hide clubs. */
const LEAGUE_CODES = new Set(['BL1','PL','ELC','PD','SA','FL1','DED','PPL','BSA',
                              'bl2','bl3','rln','rlno']);
const BERLIN_DAY = new Intl.DateTimeFormat('en-CA',
  {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit'});
const berlinDay = iso => BERLIN_DAY.format(new Date(iso));

/* Valhalla's encoded line, six decimal places. */
function decodeShape(str, precision = 6){
  const f = 10 ** precision, pts = [];
  let i = 0, lat = 0, lon = 0;
  while(i < str.length){
    for(const k of [0, 1]){
      let res = 0, shift = 0, b;
      do{ b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; }while(b >= 32);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if(k === 0) lat += d; else lon += d;
    }
    pts.push([lat / f, lon / f]);
  }
  return pts;
}

/* The route as points about 150 m apart at most, each with its distance
   along the route. Thinning only drops points on straight stretches
   between kept ones, so a club's distance from the line moves by metres. */
function prepareLine(pts){
  const out = [{lat: pts[0][0], lon: pts[0][1], along: 0}];
  let along = 0, prev = pts[0];
  for(let i = 1; i < pts.length; i++){
    along += haversine(prev[0], prev[1], pts[i][0], pts[i][1]);
    prev = pts[i];
    const last = out[out.length - 1];
    if(i === pts.length - 1 || along - last.along >= 0.15)
      out.push({lat: pts[i][0], lon: pts[i][1], along});
  }
  return out;
}

/* Shortest straight-line distance from a point to the route line, and
   how far along the route the nearest point is. Flat projection around
   the club, which is exact to well under 1% at these distances. */
function nearestOnLine(line, lat, lon){
  const kx = 111.320 * Math.cos(lat * Math.PI / 180), ky = 110.574;
  let best = Infinity, at = 0;
  let ax = (line[0].lon - lon) * kx, ay = (line[0].lat - lat) * ky;
  for(let i = 1; i < line.length; i++){
    const bx = (line[i].lon - lon) * kx, by = (line[i].lat - lat) * ky;
    const dx = bx - ax, dy = by - ay, len2 = dx*dx + dy*dy;
    let t = len2 ? -(ax*dx + ay*dy) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = ax + t*dx, py = ay + t*dy, d = Math.hypot(px, py);
    if(d < best){ best = d; at = line[i-1].along + t * (line[i].along - line[i-1].along); }
    ax = bx; ay = by;
  }
  return {off: best, along: at};
}

function clubsNearLine(line, maxKm){
  let s = 90, n = -90, w = 180, e = -180;
  for(const p of line){ s = Math.min(s, p.lat); n = Math.max(n, p.lat);
                        w = Math.min(w, p.lon); e = Math.max(e, p.lon); }
  const padLat = maxKm / 110.574;
  const out = [];
  for(const club of CLUBS){
    if(club.lat < s - padLat || club.lat > n + padLat) continue;
    const padLon = maxKm / (111.320 * Math.cos(club.lat * Math.PI / 180));
    if(club.lon < w - padLon || club.lon > e + padLon) continue;
    const r = nearestOnLine(line, club.lat, club.lon);
    if(r.off <= maxKm) out.push({club, off: r.off, along: r.along});
  }
  return out.sort((a, b) => a.along - b.along || a.off - b.off);
}

/* Each fixture file's matches get their German-time day and whether that
   day is only provisional, once per visit.

   A day can be a placeholder, not only a time. football-data.org puts a
   whole unscheduled matchday on one day with status SCHEDULED at 00:00
   UTC - every Bundesliga matchday-12 game on Sat 5 Dec, where a scheduled
   matchday runs Friday to Sunday - so a SCHEDULED match's day is
   provisional as well as its time. OpenLigaDB has no status; there a
   round whose every match shares one kickoff (all nine Regionalliga Nord
   round-12 games at Sunday 13:00) is read as possibly provisional. That
   also catches a genuinely simultaneous last matchday, which is the
   cautious way to be wrong: it only ever keeps a club, never hides one. */
function dayInfo(file){
  if(file._days) return file._days;
  const all = file.matches || [];
  const rounds = new Map();
  for(const m of all){
    m._day = m.utcDate ? berlinDay(m.utcDate) : null;
    m._provisional = timeNotSet(m);
    if(m.status === undefined && m.roundOrder != null && m.utcDate){
      if(!rounds.has(m.roundOrder)) rounds.set(m.roundOrder, []);
      rounds.get(m.roundOrder).push(m);
    }
  }
  for(const r of rounds.values())
    if(r.length >= 3 && r.every(m => m.utcDate === r[0].utcDate))
      r.forEach(m => m._provisional = true);
  const days = all.map(m => m._day).filter(Boolean).sort();
  return file._days = {first: days[0], last: days[days.length - 1]};
}

const PROVISIONAL_SLACK_DAYS = 3;    // a matchday runs Friday to Monday
const dayGap = (a, b) => Math.abs(Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5;

/* What the fixture files say about one club on one German-time day.
   state is 'home' (a home match fixed for that day), 'maybe' (a home
   match whose day is provisional and falls within three days of it),
   'none' (a league file covering the day shows no home match, so the
   club is left out), or 'unknown' (kept and marked, with the reason). */
async function homeOnDay(club, day, links){
  const entry = links.clubs?.[club.id];
  if(!entry) return {state: 'unknown', tag: 'no fixture source',
    note: 'No fixture source is linked to this club, so nothing says whether it is at home.'};
  const fixed = [], maybe = [], failed = [], covered = [], other = [];
  let undated = 0;
  for(const link of entry.links){
    for(const comp of link.competitions){
      const f = await jsonFile(comp.file);
      if(!f.ok){ failed.push(comp.label); continue; }
      const span = dayInfo(f.v);
      if(LEAGUE_CODES.has(comp.code) && span.first && span.first <= day && day <= span.last)
        covered.push(comp.label);
      else other.push(comp.label);
      for(const m of f.v.matches || []){
        if(String(m.home?.id) !== link.teamId) continue;
        if(!m._day){ undated++; continue; }
        const hit = Object.assign({_comp: comp.label}, m);
        if(!m._provisional && m._day === day) fixed.push(hit);
        else if(m._provisional && dayGap(m._day, day) <= PROVISIONAL_SLACK_DAYS) maybe.push(hit);
      }
    }
  }
  if(fixed.length) return {state: 'home', matches: fixed.concat(maybe)};
  if(maybe.length) return {state: 'maybe', matches: maybe};
  if(failed.length) return {state: 'unknown', tag: 'fixtures not loaded',
    note: `Could not load ${failed.join(', ')}.`};
  if(undated) return {state: 'unknown', tag: 'undated home matches',
    note: `${undated} home match${undated === 1 ? ' has' : 'es have'} no date set yet.`};
  if(covered.length) return {state: 'none'};
  return {state: 'unknown', tag: 'day not covered',
    note: `The linked fixtures (${[...new Set(other)].join(', ')}) do not cover this day's league games.`};
}

function setEnd(which, lat, lon, label){
  ROUTE_ENDS[which] = {lat, lon, label};
  const box = document.querySelector(`#routeBody .pt[data-end="${which}"]`);
  box.querySelector('.chosen').innerHTML = `<b>${esc(label)}</b> · ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  box.querySelector('.hits').innerHTML = '';
  document.getElementById('routeGo').disabled = !(ROUTE_ENDS.from && ROUTE_ENDS.to);
  drawEnds();
}

function drawEnds(){
  if(!ROUTE_LAYER) return;
  ROUTE_LAYER.eachLayer(l => { if(l.options.endMarker) ROUTE_LAYER.removeLayer(l); });
  for(const [which, txt] of [['from', 'A'], ['to', 'B']]){
    const p = ROUTE_ENDS[which];
    if(!p) continue;
    L.marker([p.lat, p.lon], {endMarker: true, interactive: false, icon: L.divIcon({className: '',
      html: `<div class="gpin" style="width:22px;height:22px;background:${ROUTE_COLOUR};color:#0d1117">${txt}</div>`,
      iconSize: [22, 22], iconAnchor: [11, 11]})}).addTo(ROUTE_LAYER);
  }
}

function startPick(which){
  PICKING = which;
  document.getElementById('routePanel').hidden = true;
  document.getElementById('pickText').textContent =
    `Tap the map to set the ${which === 'from' ? 'start' : 'end'}`;
  document.getElementById('pickBar').hidden = false;
}

function endPick(){
  PICKING = null;
  document.getElementById('pickBar').hidden = true;
  document.getElementById('routePanel').hidden = false;
}

function pickPoint(lat, lon, label){
  const which = PICKING;
  endPick();
  setEnd(which, lat, lon, label || 'Point on the map');
}

async function findPlace(which){
  const box = document.querySelector(`#routeBody .pt[data-end="${which}"]`);
  const text = box.querySelector('input').value.trim();
  const hits = box.querySelector('.hits');
  if(!text){ hits.innerHTML = '<p class="err">Type a place first.</p>'; return; }
  hits.innerHTML = '<div class="sub">Searching…</div>';
  const q = new URLSearchParams({text, size: '5', api_key: STADIA_KEY});
  if(HOME){ q.set('focus.point.lat', HOME.lat); q.set('focus.point.lon', HOME.lon); }
  let res, data;
  try{
    res = await fetch('https://api.stadiamaps.com/geocoding/v1/search?' + q);
    data = await res.json().catch(() => null);
  }catch(err){
    hits.innerHTML = `<p class="err">Place search failed: ${esc(err.message)}` +
      (navigator.onLine === false ? ' - this phone is offline, and place search needs a connection' : '') + '.</p>'; return;
  }
  if(!res.ok){
    hits.innerHTML = `<p class="err">Place search failed: HTTP ${res.status}` +
      (data?.error ? ` - ${esc(data.error)}` : '') + '.</p>'; return;
  }
  const feats = (data?.features || []).filter(f => f.geometry?.coordinates);
  if(!feats.length){ hits.innerHTML = `<p class="err">Nothing found for "${esc(text)}".</p>`; return; }
  hits.innerHTML = feats.map((f, i) =>
    `<button data-i="${i}">${esc(f.properties?.label || f.properties?.name || 'unnamed')}</button>`).join('');
  hits.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const f = feats[Number(b.dataset.i)];
    setEnd(which, f.geometry.coordinates[1], f.geometry.coordinates[0],
           f.properties?.label || f.properties?.name || text);
  }));
}

async function getRoute(){
  const out = document.getElementById('routeOut');
  const go = document.getElementById('routeGo');
  if(!ROUTE_ENDS.from || !ROUTE_ENDS.to) return;
  go.disabled = true;
  out.innerHTML = '<p class="unavail">Asking Stadia Maps for the route…</p>';
  const body = {locations: [ROUTE_ENDS.from, ROUTE_ENDS.to].map(p => ({lat: p.lat, lon: p.lon, type: 'break'})),
                costing: 'auto', units: 'kilometers', directions_type: 'none'};
  let res, data;
  try{
    res = await fetch('https://api.stadiamaps.com/route/v1?api_key=' + STADIA_KEY, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    data = await res.json().catch(() => null);
  }catch(err){
    out.innerHTML = `<p class="err">The route request failed: ${esc(err.message)}` +
      (navigator.onLine === false ? ' - this phone is offline, and routing needs a connection' : '') + '. Nothing is drawn.</p>';
    go.disabled = false; return;
  }
  go.disabled = false;
  const legs = data?.trip?.legs;
  if(!res.ok || !legs?.length){
    out.innerHTML = `<p class="err">No route: HTTP ${res.status}` +
      (data?.error ? ` - ${esc(data.error)}` : '') + '. Nothing is drawn.</p>';
    return;
  }
  const pts = legs.flatMap(l => decodeShape(l.shape));
  ROUTE = {pts, line: prepareLine(pts), summary: data.trip.summary};
  ROUTE_LAYER.eachLayer(l => { if(!l.options.endMarker) ROUTE_LAYER.removeLayer(l); });
  const poly = L.polyline(pts, {color: ROUTE_COLOUR, weight: 4, opacity: .85, interactive: false})
    .addTo(ROUTE_LAYER);
  const panel = document.getElementById('routePanel');
  MAP.fitBounds(poly.getBounds(), {paddingTopLeft: [24, 60],
    paddingBottomRight: [24, Math.min(panel.offsetHeight, MAP.getSize().y * .6) + 20]});
  out.innerHTML =
    `<h4>Route</h4>` +
    field('Length', `${ROUTE.summary.length.toFixed(0)} km by road`) +
    field('Driving time', fmtDuration(ROUTE.summary.time) + " (Stadia Maps' estimate, no traffic)") +
    `<div class="ctl"><span>Within</span><input type="range" id="routeKm" min="1" max="100" step="1" value="25">` +
      `<b id="routeKmTxt">25 km</b><span>of the road</span></div>` +
    `<div class="ctl"><span>Home match on</span><input type="date" id="routeDay">` +
      `<button class="b" id="routeDayClear">Any day</button></div>` +
    `<div id="routeList"></div>`;
  const km = document.getElementById('routeKm');
  km.addEventListener('input', () => {
    document.getElementById('routeKmTxt').textContent = km.value + ' km';
    renderRouteList();
  });
  document.getElementById('routeDay').addEventListener('change', renderRouteList);
  document.getElementById('routeDayClear').addEventListener('click', () => {
    document.getElementById('routeDay').value = ''; renderRouteList();
  });
  renderRouteList();
}

function fmtDuration(sec){
  if(sec == null) return null;
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}

let ROUTE_RENDER = 0;
async function renderRouteList(){
  const list = document.getElementById('routeList');
  if(!ROUTE || !list) return;
  const ticket = ++ROUTE_RENDER;
  const maxKm = Number(document.getElementById('routeKm').value);
  const day = document.getElementById('routeDay').value;    // YYYY-MM-DD or ''
  const near = clubsNearLine(ROUTE.line, maxKm);

  const links = await jsonFile('data/clubs/fixture-links.json');
  if(ticket !== ROUTE_RENDER) return;
  const linked = id => links.ok && !!links.v.clubs?.[id];

  let rows = near.map(n => ({...n, fx: null}));
  let hidden = 0;
  if(day){
    if(!links.ok){
      list.innerHTML = `<p class="err">data/clubs/fixture-links.json could not be loaded ` +
        `(${esc(links.err)}), so no club can be checked for a home match.</p>`;
      return;
    }
    for(const r of rows) r.fx = await homeOnDay(r.club, day, links.v);
    if(ticket !== ROUTE_RENDER) return;
    hidden = rows.filter(r => r.fx.state === 'none').length;
    rows = rows.filter(r => r.fx.state !== 'none');
  }

  const home = rows.filter(r => r.fx?.state === 'home').length;
  const maybe = rows.filter(r => r.fx?.state === 'maybe').length;
  const unknown = rows.filter(r => r.fx?.state === 'unknown').length;
  let head = `<h4>${near.length} club${near.length === 1 ? '' : 's'} within ${maxKm} km of the road</h4>`;
  if(day) head += `<div class="sub">${home} with a home match on ${esc(day)}; ` +
    `${maybe} with a home match whose day is not fixed yet and may be that day; ` +
    `${unknown} kept because their fixture data cannot say; ` +
    `${hidden} left out because their league fixtures show no home match that day.</div>`;

/* ----------------------------------------------------------- derbies */

/* Derbies near home. data/derbies.csv is hand-written, one row per derby,
   each with a source that names the rivalry; tools/check_derbies.py reads
   it back. Nothing here adds a derby or guesses one.

   A derby is listed only when BOTH clubs are on the map. A row whose club
   is not on the map yet (the offMap column) stays in the file and is
   counted at the foot of the list, never drawn.

   Distance is home to the NEARER of the two grounds, as the club sheet
   measures it: straight line times the settings multiplier, a road
   estimate and not a drive. Both grounds are shown.

   The next meeting comes from the fixture files through
   data/clubs/fixture-links.json, the same join the club sheet uses:
   a match counts only when both teams are the two clubs' linked ids in
   one source. Nothing is matched by name. */

const DERBY_KINDS = {city: 'city derby', regional: 'regional derby', historic: 'historic rivalry'};
let DERBY_OPEN = null;     // the derby whose detail is showing, or null for the list
let DERBY_MAX = 100;       // km, the slider's value; 100 by default

/* Same rule as tools/check_derbies.py: two clubs share a division when
   they are in one country at one tier and that tier is one league, or
   their own league tags name the same one. */
function sameDivision(a, b, tiers){
  if(a.country !== b.country) return {v: 'different', why: `${a.country} and ${b.country} pyramids`};
  if(a.tier !== b.tier) return {v: 'different', why: `tier ${a.tier} and tier ${b.tier}`};
  const name = c => {
    const at = tiers.filter(t => t.country === c.country && String(t.tier) === String(c.tier));
    const own = at.filter(t => (c.leagues || []).includes(t.leagueQid));
    return own.length === 1 ? own[0].label : at.length === 1 ? at[0].label : null;
  };
  const la = name(a), lb = name(b);
  if(la && lb) return la === lb ? {v: 'same', why: la} : {v: 'different', why: `${la} and ${lb}`};
  return {v: 'unknown', why: `both tier ${a.tier} in ${a.country}; nothing here says whether it is one division`};
}

async function loadDerbies(){
  const f = await csvFile('data/derbies.csv');
  if(!f.ok) return {err: f.err};
  const byId = new Map(CLUBS.map(c => [c.id, c]));
  const shown = [], offMap = [], malformed = [];
  const isQ = q => /^Q[1-9]\d*$/.test(q);
  for(const r of f.v){
    /* The checker rejects these; the page skips them rather than drawing
       a derby with no source or no club. */
    if(!r.name || !isQ(r.clubA) || !isQ(r.clubB) || !/^https?:\/\//.test(r.source || '')){
      malformed.push(r.name || '(no name)'); continue;
    }
    const a = byId.get(r.clubA), b = byId.get(r.clubB);
    if(!a || !b){ offMap.push(r); continue; }
    shown.push({row: r, a, b});
  }
  return {shown, offMap, malformed};
}

function derbyDistances(d){
  const ka = roadEstimate(d.a.lat, d.a.lon), kb = roadEstimate(d.b.lat, d.b.lon);
  return {ka, kb, near: Math.min(ka, kb)};
}

async function renderDerbies(){
  const body = document.getElementById('derbyBody');
  document.getElementById('derbyTitle').textContent = 'Derbies near home';
  DERBY_OPEN = null;
  const [D, tiers] = await Promise.all([loadDerbies(), csvFile('data/league-tiers.csv')]);
  if(D.err){
    body.innerHTML = `<p class="err">data/derbies.csv could not be loaded (${esc(D.err)}).</p>`;
    return;
  }
  const max = DERBY_MAX;
  const list = D.shown.map(d => ({...d, ...derbyDistances(d),
      div: tiers.ok ? sameDivision(d.a, d.b, tiers.v) : {v: 'unknown', why: 'data/league-tiers.csv not loaded'}}))
    .sort((x, y) => x.near - y.near);
  const near = list.filter(d => d.near <= max);

  body.innerHTML =
    `<div class="ctl"><span>Within</span><input type="range" id="derbyKm" min="10" max="1500" step="10" value="${max}">` +
      `<b id="derbyKmTxt">${max} km</b><span>of ${esc(HOME.label)}</span></div>` +
    `<h4>${near.length} derb${near.length === 1 ? 'y' : 'ies'} within ${max} km</h4>` +
    (near.length ? near.map((d, i) => {
      const nearA = d.ka <= d.kb;
      const kind = DERBY_KINDS[d.row.kind] || d.row.kind;
      let tags = `<span class="tag">${esc(kind)}</span><span class="tag">${esc(d.a.country === d.b.country ? d.a.country : d.a.country + '/' + d.b.country)}</span>`;
      if(d.div.v === 'different') tags += '<span class="tag warn">different divisions: cup only</span>';
      return `<button class="rclub" data-i="${i}"><i style="background:${TIER_COLOUR[Math.min(d.a.tier, d.b.tier)] || '#888'}"></i>` +
        `<span class="rn">${esc(d.row.name)}` +
        `<span class="rd">${esc(d.a.name)} v ${esc(d.b.name)}</span>` +
        `<span class="rd">≈ ${d.near} km to ${esc((nearA ? d.a : d.b).venue || (nearA ? d.a : d.b).name)}` +
        ` · ≈ ${nearA ? d.kb : d.ka} km to ${esc((nearA ? d.b : d.a).venue || (nearA ? d.b : d.a).name)}</span>` +
        `<span class="meta">${tags}</span></span></button>`;
    }).join('') : '<p class="unavail">No derby with both clubs on the map is that close. Move the slider.</p>') +
    `<div class="sub">${list.length} derb${list.length === 1 ? 'y has' : 'ies have'} both clubs on the map; ` +
      `${list.length - near.length} are further than ${max} km.` +
      (D.offMap.length ? ` ${D.offMap.length} more in data/derbies.csv wait for a club that is not on the map yet` +
        ` (${esc(D.offMap.map(r => r.name).join(', '))}).` : '') + `</div>` +
    (D.malformed.length ? `<p class="err">${D.malformed.length} row(s) in data/derbies.csv skipped as incomplete: ` +
      `${esc(D.malformed.join(', '))}. tools/check_derbies.py says why.</p>` : '') +
    `<div class="sub">Distance is a road estimate (straight line × ${MULTIPLIER}) from home to the nearer ground, ` +
      `not a drive. Every derby here is hand-written with a source that names it.</div>`;

  const slider = body.querySelector('#derbyKm');
  slider.addEventListener('input', () => { body.querySelector('#derbyKmTxt').textContent = slider.value + ' km'; });
  slider.addEventListener('change', () => { DERBY_MAX = Number(slider.value); renderDerbies(); });
  body.querySelectorAll('.rclub').forEach(b => b.addEventListener('click', () =>
    openDerby(near[Number(b.dataset.i)], max)));
}

/* Every match in the fixture files between the two clubs' linked teams. */
async function derbyMeetings(d){
  const links = await jsonFile('data/clubs/fixture-links.json');
  if(!links.ok) return {state: 'error', err: links.err};
  const ea = links.v.clubs?.[d.a.id], eb = links.v.clubs?.[d.b.id];
  const missing = [!ea && d.a, !eb && d.b].filter(Boolean);
  if(missing.length) return {state: 'nosource', missing};
  const pairs = [];
  for(const la of ea.links) for(const lb of eb.links)
    if(la.source === lb.source) pairs.push([la, lb]);
  if(!pairs.length) return {state: 'nocommon', ea, eb};
  const found = [], seen = new Set(), failed = [];
  for(const [la, lb] of pairs){
    const comps = new Map();
    for(const c of la.competitions.concat(lb.competitions)) comps.set(c.file, c);
    for(const comp of comps.values()){
      const f = await jsonFile(comp.file);
      if(!f.ok){ failed.push(comp.label); continue; }
      dayInfo(f.v);                                   // marks provisional OpenLigaDB rounds
      for(const m of f.v.matches || []){
        const ids = [String(m.home?.id), String(m.away?.id)];
        if(!(ids.includes(la.teamId) && ids.includes(lb.teamId))) continue;
        const key = la.source + ':' + m.id;
        if(seen.has(key)) continue;
        seen.add(key);
        found.push(Object.assign({_comp: comp.label}, m));
      }
    }
  }
  const now = Date.now() - 3*3600e3;
  const time = m => m.utcDate ? new Date(m.utcDate).getTime() : Infinity;
  const ahead = found.filter(m => !isFinished(m) && fxEnd(m) >= now).sort((x, y) => time(x) - time(y));
  const past = found.filter(m => isFinished(m) || fxEnd(m) < now).sort((x, y) => time(y) - time(x));
  return {state: 'ok', ahead, past, failed};
}

function meetingRow(m){
  const score = isFinished(m) && m.homeGoals != null ? ` <span class="res">${m.homeGoals}–${m.awayGoals}</span>` : '';
  const odd = m.status && !['SCHEDULED','TIMED','FINISHED'].includes(m.status)
    ? ` <span class="tag warn">${esc(m.status.toLowerCase())}</span>` : '';
  const prov = m._provisional && !timeNotSet(m) ? ' <span class="notime">(day and time may be provisional)</span>' : '';
  return `<div class="fx"><span class="when">${fxWhen(m)}</span>` +
    `<span class="who">${esc(m.home?.name || 'home not set')} v ${esc(m.away?.name || 'away not set')}${odd}${prov}` +
    `<span class="comp">${esc(m._comp)}</span></span>${score}</div>`;
}

async function openDerby(d, max){
  DERBY_OPEN = d.row;
  const body = document.getElementById('derbyBody');
  document.getElementById('derbyTitle').textContent = d.row.name;
  const club = (c, k) => `<div class="dclub"><b>${esc(c.name)}</b>` +
    `<span class="rd">${esc(TIER_NAME[c.tier] || 'tier ' + c.tier)} · ${esc(c.country)}</span>` +
    `<span class="rd">${c.venue ? esc(c.venue) : '<span class="blank">ground not recorded</span>'} · ≈ ${k} km from home</span>` +
    `<button class="b" data-id="${esc(c.id)}">Open club sheet</button></div>`;
  const urls = d.row.source.split(';').map(u => u.trim()).filter(Boolean);
  body.innerHTML =
    `<button class="b dback" id="derbyBack">‹ All derbies</button>` +
    `<div class="meta"><span class="tag">${esc(DERBY_KINDS[d.row.kind] || d.row.kind)}</span>` +
      (d.div.v === 'different' ? '<span class="tag warn">different divisions: cup only</span>' : '') + `</div>` +
    `<div class="dclubs">${club(d.a, d.ka)}${club(d.b, d.kb)}</div>` +
    `<h4>Next meeting</h4><div id="derbyNext"><p class="unavail">Loading…</p></div>` +
    (d.div.v === 'different' ? `<p class="unavail"><b>Probably not played this season.</b> The two clubs are in different ` +
      `divisions (${esc(d.div.why)}), so they can only meet in a cup.</p>` :
     d.div.v === 'unknown' ? `<div class="sub">Division: ${esc(d.div.why)}.</div>` : '') +
    (d.row.note ? `<h4>Note</h4><div class="sub" style="font-size:13px;color:var(--dim)">${esc(d.row.note)}</div>` : '') +
    `<h4>Source</h4>` + urls.map(u => `<div class="sub"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join('');

  body.querySelector('#derbyBack').addEventListener('click', renderDerbies);
  body.querySelectorAll('.dclub button').forEach(b => b.addEventListener('click', () =>
    openSheet(CLUBS.find(c => c.id === b.dataset.id))));
  body.scrollTop = 0;

  const r = await derbyMeetings(d);
  if(DERBY_OPEN !== d.row) return;
  const box = document.getElementById('derbyNext');
  if(r.state === 'error') box.innerHTML = `<p class="err">data/clubs/fixture-links.json could not be loaded (${esc(r.err)}).</p>`;
  else if(r.state === 'nosource') box.innerHTML = r.missing.map(c =>
    unavailable('Fixtures', `${esc(c.name)} has no fixture source, so nothing here can show when the two meet.`)).join('');
  else if(r.state === 'nocommon') box.innerHTML = unavailable('Next meeting',
    `${esc(d.a.name)} and ${esc(d.b.name)} are linked to different fixture sources ` +
    `(${esc(r.ea.links.map(l => l.source).join(', '))} against ${esc(r.eb.links.map(l => l.source).join(', '))}), ` +
    `so no file holds a match between the two.`);
  else{
    let h = r.ahead.length ? meetingRow(r.ahead[0]) +
        (r.ahead.length > 1 ? `<details><summary>Later <em>— ${r.ahead.length - 1}</em></summary>${r.ahead.slice(1).map(meetingRow).join('')}</details>` : '')
      : '<p class="unavail">No meeting in the fixture data.</p>';
    if(r.past.length) h += `<details><summary>Played <em>— ${r.past.length}</em></summary>${r.past.slice(0, 5).map(meetingRow).join('')}</details>`;
    if(r.failed.length) h += `<p class="err">Could not load: ${esc(r.failed.join(', '))}.</p>`;
    h += `<div class="sub">Times are German time. From the fixture files via data/clubs/fixture-links.json.</div>`;
    box.innerHTML = h;
  }
}
